name: Setup
description: Install Vite+ and project dependencies
inputs:
  node-version:
    description: Node.js version to install
    default: "24"
runs:
  using: composite
  steps:
    - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: true
        # The next step installs once with a frozen lockfile. The default
        # install here would run every postinstall build a second time.
        run-install: false

    - name: Install dependencies
      shell: bash
      run: vp install --frozen-lockfile
