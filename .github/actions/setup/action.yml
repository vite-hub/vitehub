name: Setup
description: Install Vite+ and project dependencies
runs:
  using: composite
  steps:
    - uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
      with:
        node-version: "24"
        cache: true

    - name: Install dependencies
      shell: bash
      run: vp install --frozen-lockfile
