name: Setup
description: Install Vite+ and project dependencies
runs:
  using: composite
  steps:
    - uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
      with:
        node-version: "24"
        cache: true

    - name: Install dependencies
      shell: bash
      run: vp install --frozen-lockfile
