name: Setup
description: Install Vite+ and project dependencies
runs:
  using: composite
  steps:
    - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
      with:
        node-version: "24"
        cache: true

    - name: Install dependencies
      shell: bash
      run: vp install --frozen-lockfile
