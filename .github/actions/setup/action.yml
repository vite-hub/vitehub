name: Setup
description: Install Vite+ and project dependencies
inputs:
  node-version:
    description: Node.js version to install
    default: "24"
  prepare-docs:
    description: Build the packages the docs import and generate their .nuxt types during install. Jobs that never touch the docs set "false".
    default: "true"
runs:
  using: composite
  steps:
    - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: true
        # The next step installs once with a frozen lockfile. The default
        # install here would run every postinstall build a second time.
        run-install: false

    # The Vite+ task cache keeps one build output per package, keyed by the
    # files the build reads, so an entry from another commit is a miss, never
    # a wrong build. The docs snippets job saves it once per run.
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules/.vite/task-cache
        key: vp-task-cache-${{ runner.os }}-${{ github.sha }}
        restore-keys: vp-task-cache-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      env:
        VITEHUB_SKIP_DOCS_PREPARE: ${{ inputs.prepare-docs == 'false' && '1' || '' }}
      run: vp install --frozen-lockfile
