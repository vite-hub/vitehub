<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 0 58 40" width="58" height="40" preserveAspectRatio="xMinYMid meet" class="primitive-motion is-playing" style="--cycle: 4000ms; --scene-delay: -1760ms">
<style>
svg { color: #59636e; --ui-bg: #ffffff; }
@media (prefers-color-scheme: dark) { svg { color: #9198a1; --ui-bg: #0d1117; } }
.primitive-motion {
  --ease-move: cubic-bezier(0.65, 0, 0.35, 1);
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  overflow: visible;
}
.line,
.ink-line,
.card {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.line {
  opacity: 0.55;
}
.dashed {
  stroke-dasharray: 2.5 3;
}
.soft,
.job,
.command,
.budget,
.ink,
.token,
.band,
.pointer {
  fill: currentColor;
}
.soft {
  opacity: 0.35;
}
.ink,
.token,
.pointer {
  opacity: 0.85;
}
.token,
.band,
.ghost,
.q-in,
.blob-next {
  opacity: 0;
}
.a {
  animation-duration: var(--cycle);
  animation-delay: var(--scene-delay);
  animation-iteration-count: infinite;
  animation-fill-mode: both;
  animation-timing-function: var(--ease-move);
}
.primitive-motion:not(.is-playing) .a {
  animation-play-state: paused;
}
.src-flow { animation-name: src-flow; }
.src-flow-late { animation-delay: calc(var(--scene-delay) - var(--cycle) / 2); }
.src-mount { animation-name: src-mount; }
@media (prefers-reduced-motion: reduce) {
  .a {
    animation: none;
  }
}
@keyframes src-flow {
  0% { opacity: 0; transform: translateX(0); }
  12% { opacity: 0.7; }
  74% { opacity: 0.7; transform: translateX(-13px); }
  86%, 100% { opacity: 0; transform: translateX(-15px); }
}
@keyframes src-mount {
  0%, 26%, 50%, 76%, 100% { opacity: 0.55; }
  34%, 84% { opacity: 1; }
}
</style>
