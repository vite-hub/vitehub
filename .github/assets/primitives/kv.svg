<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 58 40" width="58" height="40" preserveAspectRatio="xMinYMid meet" fill="currentColor" shape-rendering="crispEdges" class="primitive-motion is-playing" style="--cycle: 5400ms; --scene-delay: -1998ms">
<style>
svg { color: #59636e; --ui-bg: #ffffff; }
@media (prefers-color-scheme: dark) { svg { color: #9198a1; --ui-bg: #0d1117; } }
.primitive-motion {
  overflow: visible;
}
.primitive-motion .soft {
  opacity: 0.35;
}
.primitive-motion .a {
  animation-duration: var(--cycle);
  animation-delay: var(--scene-delay);
  animation-iteration-count: infinite;
  animation-fill-mode: both;
  animation-timing-function: steps(3);
}
.primitive-motion:not(.is-playing) .a {
  animation-play-state: paused;
}
.primitive-motion .kv-strip { animation-name: kv-strip; animation-timing-function: steps(4); }
@media (prefers-reduced-motion: reduce) {
