<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 58 40" width="58" height="40" preserveAspectRatio="xMinYMid meet" fill="currentColor" shape-rendering="crispEdges" class="primitive-motion is-playing" style="--cycle: 3600ms; --scene-delay: -1728ms">
<style>
svg { color: #59636e; --ui-bg: #ffffff; }
@media (prefers-color-scheme: dark) { svg { color: #9198a1; --ui-bg: #0d1117; } }
.primitive-motion {
  overflow: visible;
}
.primitive-motion .line,
.primitive-motion .job,
.primitive-motion .command,
.primitive-motion .budget {
  opacity: 0.55;
}
.primitive-motion .soft {
  opacity: 0.35;
}
.primitive-motion .token,
.primitive-motion .band,
.primitive-motion .ghost,
.primitive-motion .q-in,
.primitive-motion .blob-next {
  opacity: 0;
}
.primitive-motion .a {
  animation-duration: var(--cycle);
  animation-delay: var(--scene-delay);
  animation-iteration-count: infinite;
  animation-fill-mode: both;
  animation-timing-function: steps(3);
}
.primitive-motion:not(.is-playing) .a {
  animation-play-state: paused;
}
.primitive-motion .q-belt { animation-name: q-belt; }
.primitive-motion .q-in { animation-name: q-in; }
.primitive-motion .q-out { animation-name: q-out; }
.primitive-motion .q-worker { animation-name: q-worker; }
@media (prefers-reduced-motion: reduce) {
  .primitive-motion .a {
    animation: none;
  }
}
@keyframes q-belt {
  0%, 20% { transform: translateX(0); animation-timing-function: steps(6); }
  60%, 99.9% { transform: translateX(12px); }
  100% { transform: translateX(0); }
}
@keyframes q-in {
  0%, 20% { opacity: 0; }
  55%, 99.9% { opacity: 0.55; }
  100% { opacity: 0; }
}
@keyframes q-out {
  0%, 32% { opacity: 0.55; }
  58%, 99.9% { opacity: 0; }
  100% { opacity: 0.55; }
}
@keyframes q-worker {
  0%, 52% { opacity: 0.35; }
  62%, 80% { opacity: 0.85; }
  96%, 100% { opacity: 0.35; }
}
</style>
