<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 0 58 40" width="58" height="40" preserveAspectRatio="xMinYMid meet" class="primitive-motion is-playing" style="--cycle: 5000ms; --scene-delay: -3500ms">
<style>
svg { color: #59636e; --ui-bg: #ffffff; }
@media (prefers-color-scheme: dark) { svg { color: #9198a1; --ui-bg: #0d1117; } }
.primitive-motion {
  --ease-move: cubic-bezier(0.65, 0, 0.35, 1);
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  overflow: visible;
}
.line,
.ink-line,
.card {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.line {
  opacity: 0.55;
}
.soft,
.job,
.command,
.budget,
.ink,
.token,
.band,
.pointer {
  fill: currentColor;
}
.soft {
  opacity: 0.35;
}
.job,
.command,
.budget {
  opacity: 0.55;
}
.ink,
.token,
.pointer {
  opacity: 0.85;
}
.a {
  animation-duration: var(--cycle);
  animation-delay: var(--scene-delay);
  animation-iteration-count: infinite;
  animation-fill-mode: both;
  animation-timing-function: var(--ease-move);
}
.primitive-motion:not(.is-playing) .a {
  animation-play-state: paused;
}
.br-cursor {
  transform-box: fill-box;
  transform-origin: 0 0;
}
.br-cursor { animation-name: br-cursor; }
.br-button { animation-name: br-button; }
@media (prefers-reduced-motion: reduce) {
  .a {
    animation: none;
  }
}
@keyframes br-cursor {
  0%, 10% { transform: translate(0, 0) scale(1); }
  32% { transform: translate(20px, 2px) scale(1); }
  35% { transform: translate(20px, 2px) scale(0.85); }
  39%, 60% { transform: translate(20px, 2px) scale(1); }
  86%, 100% { transform: translate(0, 0) scale(1); }
}
@keyframes br-button {
  0%, 34% { opacity: 0.35; }
  39%, 58% { opacity: 0.8; }
  70%, 100% { opacity: 0.35; }
}
</style>
