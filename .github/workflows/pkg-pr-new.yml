name: pkg.pr.new

on:
  push:
    branches:
      - "**"
    tags:
      - "!**"
  workflow_dispatch:

concurrency:
  group: pkg-pr-new-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: publish preview packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - run: pnpm --filter @vitehub/workspace build
      - run: pnpm --filter @vitehub/chat build
      - run: pnpm --filter @vitehub/env build

      - name: Publish preview packages
        run: pnpm dlx pkg-pr-new publish './packages/workspace' './packages/chat' './packages/env' --packageManager=pnpm
