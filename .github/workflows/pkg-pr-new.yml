name: pkg.pr.new

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pkg-pr-new-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: publish preview packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - run: pnpm --filter @vitehub/env build

      - name: Publish preview packages
        run: pnpm dlx pkg-pr-new publish './packages/env' --packageManager=pnpm
