name: pkg.pr.new

on:
  push:
    branches:
      - "**"
    tags:
      - "!**"
  workflow_dispatch:

# On main, a new push waits for the running publish instead of cancelling it.
# GitHub keeps only the newest pending run, so main always gets a preview.
concurrency:
  group: pkg-pr-new-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# No step receives the job token, so it only needs to read the repository.
permissions:
  contents: read

jobs:
  publish:
    name: publish preview packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          prepare-docs: "false"

      # Published packages come from a fresh build, not from task cache
      # fingerprints. The root build task always enables the cache.
      - run: vp run --no-cache --filter "./packages/*" build

      # Gives the previews a version that npm does not have, so pnpm resolves
      # ViteHub peers to the previews and not to npm releases.
      - run: node .github/scripts/preview-packages.mjs "$GITHUB_SHA"

      - name: Publish preview packages
        run: |
          corepack enable pnpm
          ./node_modules/.bin/pkg-pr-new publish './packages/*' --pnpm --packageManager=pnpm
