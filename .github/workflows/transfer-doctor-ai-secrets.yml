name: Transfer Doctor AI secrets

on:
  pull_request:
    types: [opened]

permissions:
  contents: read

jobs:
  transfer:
    if: github.event.pull_request.head.ref == 'codex/transfer-doctor-ai-secrets-pr-20260918'
    runs-on: ubuntu-latest
    steps:
      - name: Transfer secrets to Doctor
        env:
          GH_TOKEN: ${{ secrets.TRANSFER_TOKEN }}
          TARGET_REPOSITORY: onmax/vite-doctor
          CLIPROXY_API_KEY: ${{ secrets.CLIPROXY_API_KEY }}
          CLIPROXY_CF_ACCESS_CLIENT_ID: ${{ secrets.CLIPROXY_CF_ACCESS_CLIENT_ID }}
          CLIPROXY_CF_ACCESS_CLIENT_SECRET: ${{ secrets.CLIPROXY_CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          for name in CLIPROXY_API_KEY CLIPROXY_CF_ACCESS_CLIENT_ID CLIPROXY_CF_ACCESS_CLIENT_SECRET; do
            gh secret set "$name" --repo "$TARGET_REPOSITORY" --body "${!name}"
          done
