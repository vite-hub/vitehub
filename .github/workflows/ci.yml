name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Pushes, manual dispatches and the main guardian's repair pull requests from
# this repository run the full suite. Other pull requests skip the slow jobs.
# Steps read env.FULL_SUITE. A job if cannot read env, so jobs use the alias.
env:
  FULL_SUITE: &full-suite ${{ github.event_name != 'pull_request' || (startsWith(github.head_ref, 'babysitter/repair-main-') && github.event.pull_request.head.repo.full_name == github.repository) }}

jobs:
  ci:
    name: ci
    needs:
      - checks
      - workflow-lint
      - contracts-examples
      - contract-tests
      - package-tests
      - package-tests-success
      - typecheck
      - service-tests
      - prepublish-contracts
      - consumer-contracts
      - consumer-contracts-success
      - node-22
      - docs
      - docs-snippets
      - docs-deploy
      - console
      - console-deploy
      - verify-providers
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require successful verification
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          node <<'NODE'
          const results = JSON.parse(process.env.CI_RESULTS)
          // Pull requests run fast checks and the package tests their change
          // can affect. The full integration matrix, the Node.js floor and the
          // packed release contracts run on every push to main, and on the
          // main guardian's repair PRs from this repository: a repair that
          // passes only the PR checks merges and leaves main red. The release
          // workflow repeats the strict checks before it publishes.
          // Keep this aggregate job required so skipped PR-only jobs never
          // leave a branch protection check pending.
          const skippedPullRequestJobs = new Set([
            "contracts-examples",
            "consumer-contracts",
            "consumer-contracts-success",
            "node-22",
            "prepublish-contracts",
            "verify-providers",
          ])
          // Deploys run only on a push to main.
          const deployJobs = new Set(["docs-deploy", "console-deploy"])
          const failures = Object.entries(results).filter(([name, job]) => {
            const maySkip = (process.env.FULL_SUITE !== "true" && skippedPullRequestJobs.has(name))
              || (process.env.GITHUB_EVENT_NAME !== "push" && deployJobs.has(name))
            return job.result !== "success" && !(maySkip && job.result === "skipped")
          })
          if (failures.length) {
            for (const [name, job] of failures) console.error(`${name}: ${job.result}`)
            process.exitCode = 1
          }
          NODE

  # Pull requests run the contract and package tests that their change can
  # affect. The push-to-main run executes the complete contracts, package,
  # docs, consumer, and provider matrix.
  checks:
    name: fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup

      # Vite+ combines lint and TypeScript checks into one deterministic PR gate.
      # Formatting loads generated fixture configs, so it is excluded here.
      - run: vp check --no-fmt

      # Unused files, unused and unlisted dependencies, and unresolved imports. knip.config.ts names the
      # entries of each package, and the known findings that wait for a cleanup.
      - run: vp exec knip --no-progress

      # zizmor and actionlint do not check these inputs. The script explains why.
      - name: Check transient package executors and Docker actions
        run: node .github/scripts/check-ci-inputs.mjs

  # zizmor audits workflow security: template injection, unpinned actions and
  # images, persisted credentials, and token permissions. actionlint checks
  # workflow syntax and expressions, and runs shellcheck on every run: block.
  workflow-lint:
    name: workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.31.1
          advanced-security: false
          annotations: true
      - uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  # Split from checks, which took 9 minutes because typecheck, contracts and
  # examples each ran a full build in sequence.
  contracts-examples:
    name: contracts and examples
    if: *full-suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-deno

      - run: vp run build

      # vp pack rewrites each package's exports map in sorted order. Commit
      # that order so a local build leaves the tree clean.
      - name: Build leaves package manifests unchanged
        run: |
          git diff --exit-code -- 'packages/*/package.json' || {
            echo "::error::vp run build rewrote package.json exports. Run it locally and commit the result."
            exit 1
          }

      - name: Validate packed package metadata
        run: vp run package:metadata

  # Match Void's prepublish contract: install the exact tarballs a release
  # would publish and exercise them without workspace visibility. This runs
  # on pushes to main, manual dispatches and repair-main pull requests, so a
  # packing problem shows up on main before the release workflow repeats it.
  # Other pull requests skip it: it took 13 minutes on every one.
  prepublish-contracts:
    name: prepublish package contracts
    if: *full-suite
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-deno

      # Published packages come from a fresh build, not task cache
      # fingerprints. Keep this in sync with the release workflow.
      - run: vp run --no-cache --filter "./packages/*" build
      - name: Pack exact release tarballs
        run: |
          node .github/scripts/release-packages.mjs pack \
            --workspace . \
            --output .release/npm \
            --source-sha "$GITHUB_SHA"
      - name: Verify exact release tarballs
        run: |
          node .github/scripts/release-packages.mjs verify \
            --manifest .release/npm/release-manifest.json \
            --workspace . \
            --source-sha "$GITHUB_SHA"
      - name: Test package contracts against exact release tarballs
        env:
          VITEHUB_RELEASE_MANIFEST: ${{ github.workspace }}/.release/npm/release-manifest.json
        run: vp run test:consumer

  contract-tests:
    name: contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select contract tests
        id: scope
        if: ${{ env.FULL_SUITE != 'true' }}
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          if git diff --quiet "$BASE_REF...HEAD" -- docs fixtures/docs-hosts test package.json 'packages/*/package.json' pnpm-lock.yaml; then
            echo "exclude=test/docs-host-fixtures.test.ts" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-deno
      - if: ${{ steps.scope.outputs.exclude == '' }}
        run: vp run test:contracts
      - name: Contracts without docs host fixtures
        if: ${{ steps.scope.outputs.exclude != '' }}
        env:
          EXCLUDE: ${{ steps.scope.outputs.exclude }}
        run: vp run build && vp test --config vitest.config.ts --exclude "$EXCLUDE"

  # Without a timeout a hung shard holds main's ci concurrency group for GitHub's 6-hour default, and
  # every later main run waits behind it: on 2026-10-20 "package tests (agent 3/3)" hung three
  # times with no Vitest output. 30 minutes is about 2.5 times the slowest healthy shard.
  # Package tests were one 22-minute job. Agent test files run serially, so
  # Vitest splits them across three jobs. Workflow's playground builds take
  # about 4 minutes and set the floor. Presets, Auth, Schedule, and the docs
  # package's Nuxt builds run in the shorter shards, so "other packages" is
  # not the slowest job. The last
  # shard excludes the named packages, so a new package always runs
  # somewhere. A pull request tests only the packages it changes and their
  # dependents. A shard without one passes after checkout and does not
  # install dependencies.
  package-tests:
    name: package tests (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: agent 1/3
            args: --packages @vite-hub/agent
            test-shard: 1/3
          - name: agent 2/3
            args: --packages @vite-hub/agent
            test-shard: 2/3
          - name: agent 3/3
            args: --packages @vite-hub/agent
            test-shard: 3/3
          - name: vite-hub
            args: --packages vite-hub
          - name: workspace and presets
            args: --packages @vite-hub/workspace,@vite-hub/presets
          - name: content, workflow, and docs
            args: --packages @vite-hub/content,@vite-hub/workflow,@vite-hub/docs
          - name: storage, delivery, and auth
            args: --packages @vite-hub/blob,@vite-hub/sandbox,@vite-hub/database,@vite-hub/email,@vite-hub/kv,@vite-hub/markdown-template,@vite-hub/queue,@vite-hub/auth,@vite-hub/schedule
          - name: other packages
            args: --exclude @vite-hub/agent,vite-hub,@vite-hub/workspace,@vite-hub/presets,@vite-hub/content,@vite-hub/workflow,@vite-hub/docs,@vite-hub/blob,@vite-hub/sandbox,@vite-hub/database,@vite-hub/email,@vite-hub/kv,@vite-hub/markdown-template,@vite-hub/queue,@vite-hub/auth,@vite-hub/schedule
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select changed packages
        id: changed
        if: ${{ env.FULL_SUITE != 'true' }}
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          packages="$(node test/run-package-task.mjs test ${{ matrix.shard.args }} --affected "$BASE_REF" --list)"
          echo "Changed packages in this shard: ${packages:-none}"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
      - if: ${{ env.FULL_SUITE == 'true' || steps.changed.outputs.packages != '' }}
        uses: ./.github/actions/setup
        with:
          prepare-docs: "false"
      - if: ${{ env.FULL_SUITE == 'true' || steps.changed.outputs.packages != '' }}
        uses: ./.github/actions/setup-deno
      - if: ${{ env.FULL_SUITE == 'true' }}
        run: node test/run-package-task.mjs test --cache ${{ matrix.shard.args }}
        env:
          VITEHUB_TEST_SHARD: ${{ matrix.shard.test-shard }}
      - name: Test changed packages
        if: ${{ steps.changed.outputs.packages != '' }}
        run: node test/run-package-task.mjs test --cache --packages "$PACKAGES"
        env:
          PACKAGES: ${{ steps.changed.outputs.packages }}
          VITEHUB_TEST_SHARD: ${{ matrix.shard.test-shard }}

  # Keep the default success() condition, as for consumer contracts: needs
  # alone can lose failed matrix shards after a partial rerun.
  package-tests-success:
    needs:
      - package-tests
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - run: echo 'All package test shards passed'

  # Typechecks ran only in `verify` at release, so type errors reached main. A
  # job of its own keeps fast checks fast: each package typecheck builds the
  # package and its dependencies first. A pull request checks the packages
  # that the package test selection names. The docs site imports most
  # packages, so its typecheck runs on every pull request.
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The same heap as `vp run typecheck`. vue-tsc checks the docs site in Node.
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select changed packages
        id: changed
        if: ${{ env.FULL_SUITE != 'true' }}
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          packages="$(node test/run-package-task.mjs typecheck --affected "$BASE_REF" --list)"
          echo "Changed packages: ${packages:-none}"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup
      - if: ${{ env.FULL_SUITE == 'true' }}
        run: node test/run-package-task.mjs typecheck
      - name: Typecheck changed packages
        if: ${{ steps.changed.outputs.packages != '' }}
        run: node test/run-package-task.mjs typecheck --packages "$PACKAGES"
        env:
          PACKAGES: ${{ steps.changed.outputs.packages }}
      # The docs typecheck needs framework exports regardless of package selection.
      - run: vp run --cache -t vite-hub#build
      - name: Typecheck the docs site
        run: vp run --filter vitehub-docs --ignore-depends-on typecheck

  # Package tests that read VITEHUB_TEST_POSTGRES_URL or VITEHUB_TEST_REDIS_URL
  # need a real Postgres and Redis. test/service-tests.mjs finds these files by
  # the variable they read, so a new test file needs no change here.
  service-tests:
    name: postgres and redis tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: vitehub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find service tests
        id: find
        run: |
          files="$(node test/service-tests.mjs --list)"
          echo "${files:-No package test reads the service variables.}"
          echo "found=${files:+true}" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.find.outputs.found == 'true' }}
        uses: ./.github/actions/setup
      - if: ${{ steps.find.outputs.found == 'true' }}
        run: vp run test:services
        env:
          VITEHUB_TEST_POSTGRES_URL: postgres://postgres:vitehub@127.0.0.1:5432/postgres
          VITEHUB_TEST_REDIS_URL: redis://127.0.0.1:6379

  # Consumer contracts stay on push. Shard 1/3 took a median of 11.7 minutes
  # in successful runs, and pull requests already wait for package tests.
  consumer-contracts:
    name: consumer contracts (${{ matrix.shard }})
    if: *full-suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        shard:
          - 1/3
          - 2/3
          - 3/3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-deno
      - run: vp run test:consumer --shard=${{ matrix.shard }}

  # Keep the default success() condition: needs alone can lose failed matrix
  # shards after a partial rerun. This marker requires the whole matrix to pass.
  consumer-contracts-success:
    needs:
      - consumer-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - run: echo 'All consumer contract shards passed'

  # The standalone package floor is Node.js 22.18; Nitro integrations require
  # 22.22. StackBlitz WebContainers run only Node.js 22. This job covers built-ins with
  # different behavior on 22: fs glob, node:sqlite, module hooks, Response
  # brand checks, TextDecoder, and structuredClone.
  node-22:
    name: node 22.18
    if: *full-suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Contributor dependencies require a newer runtime than the standalone
      # package floor. Install them on Node 24, then test on the exact floor.
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "22.18.0"
          run-install: false

      - name: Require Node.js 22.18
        run: node -e 'if (process.version !== "v22.18.0") throw new Error("Expected Node.js v22.18.0, got " + process.version)'
      # Node 22.18 bundles Corepack 0.33, which expects pnpm's old JS entrypoint.
      # Bootstrap the exact Corepack version independently of workspace dependencies.
      - name: Install Corepack with native pnpm support
        run: npm install --global corepack@0.34.6 # zizmor: ignore[adhoc-packages]
      # Cached Vite tasks filter environment overrides. Persist this job's
      # runtime policy so pack-time pnpm subprocesses can use the package floor.
      - name: Allow the package runtime floor
        run: corepack pnpm --runtime-on-fail=ignore config set --location=project runtimeOnFail ignore
      # Install-time builds ran on Node 24. Build the targets together on 22.18
      # so each dependency runs once, preserving uncached floor validation.
      - name: Clear install-time build cache
        run: vp cache clean
      - name: Build tested packages
        run: |
          vp run --no-cache \
            --filter '@vite-hub/rate-limit...' \
            --filter '@vite-hub/sandbox...' \
            --filter '@vite-hub/database...' \
            --filter '@vite-hub/auth...' \
            --filter '@vite-hub/agent...' \
            --filter 'vite-hub...' build
      - run: vp test
        working-directory: packages/rate-limit
      - run: vp test test/runtime-type.test.ts
        working-directory: packages/runtime
      - run: vp test test/task/project.test.ts
        working-directory: packages/sandbox
      - run: vp test test/connect.test.ts test/cli.test.ts test/generated.test.ts
        working-directory: packages/database
      - run: vp test test/access-handler.test.ts
        working-directory: packages/auth
      - run: vp test test/console-auth.test.ts test/console-access-crossrealm-probe.test.ts test/nitro-optional-peers.test.ts
        working-directory: packages/vite-hub
      - run: vp test test/agent-invocations-journal-file.test.ts test/codex-home-retention.test.ts test/github-install.test.ts test/provider-runtime-packages.test.ts test/optional-capabilities-import.test.ts test/windows-1252.test.ts test/gmail-channel.test.ts test/response.test.ts test/crossrealm-trigger-response.test.ts test/stream-output-cross-realm-response.test.ts test/invocations.test.ts
        working-directory: packages/agent

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      # Snippet checker tests import the built framework and its discovery plugins.
      - run: vp run --cache -t vite-hub#build
      - run: vp run --filter vitehub-docs test
      - run: vp run docs:build
      - run: vp run --filter vitehub-docs test:artifact
      - name: Verify Worker bundle
        run: |
          ./node_modules/.bin/wrangler deploy --dry-run --config docs/.output/server/wrangler.json --outdir "$GITHUB_WORKSPACE/docs/.wrangler/bundle"
          node docs/scripts/check-worker-size.mjs "$GITHUB_WORKSPACE/docs/.wrangler/bundle"
      - name: Upload Worker bundle
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitehub-docs-output
          path: docs/.output
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # Type-checks every TypeScript block of the docs and the package READMEs
  # against the built packages. See docs/scripts/check-snippets.mjs.
  docs-snippets:
    name: docs snippets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - run: vp run build
      # This job builds every package, so its task cache serves the next run.
      - name: Save the Vite+ task cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vp-task-cache-${{ runner.os }}-${{ github.sha }}
      - run: vp run --filter vitehub-docs test:snippets

  # The docs site deploys from the verified bundle on every push to main. The Production environment holds the Cloudflare token.
  docs-deploy:
    name: docs deploy
    needs:
      - checks
      - workflow-lint
      - contracts-examples
      - contract-tests
      - package-tests-success
      - typecheck
      - service-tests
      - consumer-contracts-success
      - node-22
      - docs
      - docs-snippets
      - verify-providers
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Production
      url: https://vitehub.dev
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Download Worker bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vitehub-docs-output
          path: docs/.output

      - name: Deploy vitehub.dev
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          for required in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            if [ -z "${!required}" ]; then
              echo "Docs deploy needs the $required secret in the Production environment." >&2
              exit 1
            fi
          done
          ./node_modules/.bin/wrangler deploy --config docs/.output/server/wrangler.json

      - name: Check the live site
        run: |
          for _ in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 30 -o /dev/null "https://vitehub.dev/raw/docs/getting-started.md?deploy=${GITHUB_SHA}"; then
              echo "vitehub.dev serves ${GITHUB_SHA}."
              exit 0
            fi
            sleep 10
          done
          echo "vitehub.dev did not answer after the deploy." >&2
          exit 1

  # console.vitehub.dev runs the Console app, packages/console, on Cloudflare with D1. Pull requests check that it builds
  # and that Wrangler accepts its configuration. Pushes to main keep the build for console-deploy.
  console:
    name: hosted console
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITEHUB_HOST: cloudflare
      VITEHUB_CONSOLE_D1_ID: 8d505e03-74c1-4565-9e0d-984292802d42
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          prepare-docs: "false"

      # The Console page imports built packages, such as vite-hub/console/sections.
      # Setup and this build both use Node 24, so reuse the docs postinstall builds.
      - run: vp run --cache -t vite-hub#build
      - run: vp run --filter vite-hub build:console-account
      # The app bundles the page, so the marker goes in before the app build.
      - name: Identify Console build
        run: |
          marker="<meta name=\"vitehub-deploy\" content=\"${GITHUB_SHA}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}\">"
          sed -i "s|</head>|${marker}</head>|" packages/vite-hub/.vitehub/console-account/index.html
      - run: vp run --filter @vite-hub/console build
      - name: Verify Worker configuration
        run: ./node_modules/.bin/wrangler deploy --dry-run --config packages/console/.output/server/wrangler.json --name vitehub-console
      # The page goes along, so console-deploy reads the marker from it.
      - name: Upload Console
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitehub-console
          path: |
            packages/console/.output
            packages/vite-hub/.vitehub/console-account/index.html
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # console.vitehub.dev deploys from the verified build on every push to main, like the docs site. The Production
  # environment holds the Cloudflare token, which must allow Workers, D1, and custom domains on the vitehub.dev zone.
  # The Worker keeps BETTER_AUTH_SECRET, VITEHUB_CONSOLE_SECRET, GITHUB_CLIENT_ID, and GITHUB_CLIENT_SECRET as secrets.
  console-deploy:
    name: console deploy
    needs:
      - checks
      - workflow-lint
      - contracts-examples
      - contract-tests
      - package-tests-success
      - typecheck
      - service-tests
      - consumer-contracts-success
      - node-22
      - docs-snippets
      - console
      - verify-providers
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Production
      url: https://console.vitehub.dev
    concurrency:
      group: console-deploy
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Download Console
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vitehub-console
          path: packages

      # Migrations go first, so the new Worker never runs on an older schema.
      - name: Deploy console.vitehub.dev
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        working-directory: packages/console/.output/server
        run: |
          for required in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            if [ -z "${!required}" ]; then
              echo "Console deploy needs the $required secret in the Production environment." >&2
              exit 1
            fi
          done
          wrangler="$GITHUB_WORKSPACE/node_modules/.bin/wrangler"
          "$wrangler" d1 migrations apply DB --remote --config wrangler.json
          "$wrangler" deploy --config wrangler.json --name vitehub-console --domain console.vitehub.dev

      # The marker identifies this upload. Read it from the deployed page: a rerun of only this job reuses the build of
      # an earlier attempt of the same run, so the marker carries that attempt. It must still name this commit and run.
      - name: Check the live site
        run: |
          marker=$(grep -oE '<meta name="vitehub-deploy" content="[^"]+">' packages/vite-hub/.vitehub/console-account/index.html | grep -F "content=\"${GITHUB_SHA}:${GITHUB_RUN_ID}:" | head -n 1 || true)
          if [ -z "$marker" ]; then
            echo "The Console build has no deployment marker for this commit and run." >&2
            exit 1
          fi
          for _ in $(seq 18); do
            if curl --fail --silent --show-error --max-time 30 "https://console.vitehub.dev/?deploy=${GITHUB_SHA}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" | grep -F "$marker" > /dev/null; then
              echo "console.vitehub.dev serves ${GITHUB_SHA}."
              exit 0
            fi
            sleep 10
          done
          echo "console.vitehub.dev does not serve this build after the deploy." >&2
          exit 1

  verify-providers:
    name: verify providers
    if: *full-suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      srh:
        image: hiett/serverless-redis-http@sha256:65128347949bca511e448fd7238780d624573d74c22b79155a7563db19e9b678 # 0.0.10
        env:
          SRH_MODE: env
          SRH_TOKEN: local-srh-token
          SRH_CONNECTION_STRING: redis://redis:6379
        ports:
          - 8079:80
      sqld:
        image: ghcr.io/tursodatabase/libsql-server@sha256:6dd3eb276d9d3604e4a48ac4a999a2e267814732d57d7e94c04ba71482333a67 # revision d6c75af (2026-08-23)
        ports:
          - 8080:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Cloudflare output contract
        run: vp run test:output:cloudflare
      - name: Cloudflare local run
        run: vp run e2e:local --provider cloudflare
      - name: Vercel output contract
        run: vp run test:output:vercel
      - name: Vercel local run
        run: vp run e2e:local --provider vercel
        env:
          KV_REST_API_TOKEN: local-srh-token
          KV_REST_API_URL: http://127.0.0.1:8079
          TURSO_DATABASE_URL: http://127.0.0.1:8080
      # The exact version pins the CLI. Moving it into the root devDependencies
      # would add its large dependency tree to the workspace lockfile.
      - name: Install Netlify CLI
        run: npm install -g netlify-cli@23.15.1 # zizmor: ignore[adhoc-packages]
      - name: Netlify end-to-end
        run: vp run e2e:netlify
