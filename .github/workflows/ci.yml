name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-deno

      - name: Fallow dead-code
        shell: bash
        run: |
          report="$(mktemp)"
          set +e
          vp run fallow:dead-code | tee "$report"
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "## Fallow Dead Code"
            echo
            cat "$report"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Knip catalog
        run: vp run knip:catalog

      - run: vp run lint
      - run: vp run doctor:typescript
        env:
          VITE_DOCTOR_SINCE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before || 'HEAD^' }}
      - run: vp run typecheck
      - run: vp run test:contracts
      - run: vp run examples:verify
      - run: vp run test

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - run: vp run --filter vitehub-docs test
      - run: vp run docs:build
      - name: Verify Worker bundle
        working-directory: docs
        run: vp dlx "wrangler@4.112.0" deploy --dry-run --config .output/server/wrangler.json

  consumer:
    name: consumer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - run: vp run test:consumer

  verify-cloudflare:
    name: verify (cloudflare)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - run: vp run build
      - run: vp run playground:vite:build:local --provider cloudflare
      - name: Provider Output Contract
        run: vp run test:output:cloudflare
      - name: Local Provider Run
        run: vp run e2e:local --provider cloudflare

  verify-vercel:
    name: verify (vercel)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      srh:
        image: hiett/serverless-redis-http:latest
        env:
          SRH_MODE: env
          SRH_TOKEN: local-srh-token
          SRH_CONNECTION_STRING: redis://redis:6379
        ports:
          - 8079:80
      sqld:
        image: ghcr.io/tursodatabase/libsql-server:latest
        ports:
          - 8080:8080
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - run: vp run build
      - run: vp run playground:vite:build:local --provider vercel
      - name: Provider Output Contract
        run: vp run test:output:vercel
      - name: Local Provider Run
        run: vp run e2e:local --provider vercel
        env:
          KV_REST_API_TOKEN: local-srh-token
          KV_REST_API_URL: http://127.0.0.1:8079
          TURSO_DATABASE_URL: http://127.0.0.1:8080

  verify-netlify:
    name: verify (netlify)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - run: npm install -g netlify-cli@23.15.1
      - run: vp run e2e:netlify
