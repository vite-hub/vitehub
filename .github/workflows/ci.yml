name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Fallow dead-code
        shell: bash
        run: |
          report="$(mktemp)"
          set +e
          pnpm fallow:dead-code | tee "$report"
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "## Fallow Dead Code"
            echo
            cat "$report"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:contracts
      - run: pnpm test
      - run: pnpm build

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - run: pnpm --dir docs test
      - run: pnpm docs:build

  verify-cloudflare:
    name: verify (cloudflare)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - run: pnpm build
      - run: node test/local/build-playground.mjs --provider cloudflare
      - name: Provider Output Contract
        run: pnpm test:output
        env:
          VITEHUB_OUTPUT_PROVIDER: cloudflare
      - name: Local Provider Run
        run: pnpm e2e:local --provider cloudflare

  verify-vercel:
    name: verify (vercel)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      srh:
        image: hiett/serverless-redis-http:latest
        env:
          SRH_MODE: env
          SRH_TOKEN: local-srh-token
          SRH_CONNECTION_STRING: redis://redis:6379
        ports:
          - 8079:80
      sqld:
        image: ghcr.io/tursodatabase/libsql-server:latest
        ports:
          - 8080:8080
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - run: pnpm build
      - run: node test/local/build-playground.mjs --provider vercel
      - name: Provider Output Contract
        run: pnpm test:output
        env:
          VITEHUB_OUTPUT_PROVIDER: vercel
      - name: Local Provider Run
        run: pnpm e2e:local --provider vercel
        env:
          KV_REST_API_TOKEN: local-srh-token
          KV_REST_API_URL: http://127.0.0.1:8079
          TURSO_DATABASE_URL: http://127.0.0.1:8080
