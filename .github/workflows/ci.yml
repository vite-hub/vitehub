name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    needs:
      - checks
      - contracts-examples
      - contract-tests
      - package-tests
      - package-tests-success
      - consumer-contracts
      - consumer-contracts-success
      - windows-agent-credentials
      - docs
      - docs-deploy
      - verify-providers
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require successful verification
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          node <<'NODE'
          const results = JSON.parse(process.env.CI_RESULTS)
          const skippedPullRequestJobs = new Set([
            "contract-tests",
            "consumer-contracts",
            "consumer-contracts-success",
            "windows-agent-credentials",
            "verify-providers",
          ])
          const failures = Object.entries(results).filter(([name, job]) => {
            const maySkip = (process.env.GITHUB_EVENT_NAME === "pull_request"
              && skippedPullRequestJobs.has(name))
              || (process.env.GITHUB_EVENT_NAME !== "push" && name === "docs-deploy")
            return job.result !== "success" && !(maySkip && job.result === "skipped")
          })
          if (failures.length) {
            for (const [name, job] of failures) console.error(`${name}: ${job.result}`)
            process.exitCode = 1
          }
          NODE

  checks:
    name: lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-deno

      - name: Knip catalog
        run: vp run knip:catalog

      - run: vp run lint
      - run: vp run doctor:typescript
        env:
          VITE_DOCTOR_SINCE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before || 'HEAD^' }}
      - run: vp run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Docs links
        run: vp run --filter vitehub-docs test:links

  # Split from checks, which took 9 minutes because typecheck, contracts and
  # examples each ran a full build in sequence.
  contracts-examples:
    name: contracts and examples
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-deno

      # Run contracts first: examples:verify leaves generated example output
      # that the repository contract tests would scan.
      - run: vp run build

      - name: Fast contracts
        if: ${{ github.event_name == 'pull_request' }}
        run: vp test --config vitest.config.ts --exclude test/docs-host-fixtures.test.ts

      - run: vp run --ignore-depends-on examples:verify

  contract-tests:
    name: contract tests
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-deno
      - run: vp run test:contracts

  # Package tests were one 22-minute job. Agent test files run serially, so
  # Vitest splits them across three jobs. Workflow's playground builds take
  # about 4 minutes and set the floor. The last shard excludes the named
  # packages, so a new package always runs somewhere.
  package-tests:
    name: package tests (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: agent 1/3
            args: --packages @vite-hub/agent
            test-shard: 1/3
          - name: agent 2/3
            args: --packages @vite-hub/agent
            test-shard: 2/3
          - name: agent 3/3
            args: --packages @vite-hub/agent
            test-shard: 3/3
          - name: vite-hub
            args: --packages vite-hub
          - name: workspace
            args: --packages @vite-hub/workspace
          - name: content and workflow
            args: --packages @vite-hub/content,@vite-hub/workflow
          - name: storage and delivery
            args: --packages @vite-hub/blob,@vite-hub/box,@vite-hub/database,@vite-hub/email,@vite-hub/kv,@vite-hub/markdown-template,@vite-hub/queue
          - name: other packages
            args: --exclude @vite-hub/agent,vite-hub,@vite-hub/workspace,@vite-hub/content,@vite-hub/workflow,@vite-hub/blob,@vite-hub/box,@vite-hub/database,@vite-hub/email,@vite-hub/kv,@vite-hub/markdown-template,@vite-hub/queue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-deno
      - run: node test/run-package-task.mjs test ${{ matrix.shard.args }}
        env:
          VITEHUB_TEST_SHARD: ${{ matrix.shard.test-shard }}

  # Keep the default success() condition, as for consumer contracts: needs
  # alone can lose failed matrix shards after a partial rerun.
  package-tests-success:
    needs:
      - package-tests
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - run: echo 'All package test shards passed'

  consumer-contracts:
    name: consumer contracts (${{ matrix.shard }})
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard:
          - 1/3
          - 2/3
          - 3/3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-deno
      - run: vp run test:consumer --shard=${{ matrix.shard }}

  # Keep the default success() condition: needs alone can lose failed matrix
  # shards after a partial rerun. This marker requires the whole matrix to pass.
  consumer-contracts-success:
    needs:
      - consumer-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - run: echo 'All consumer contract shards passed'

  windows-agent-credentials:
    name: agent credentials (windows)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Build Agent test dependencies
        run: vp run -t @vite-hub/agent#build

      - name: Codex credential ACLs
        shell: bash
        working-directory: packages/agent
        run: vp test test/provider-agent.test.ts -t "restricts Codex credential home ACLs on Windows"

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - run: vp run --filter vitehub-docs test
      - run: vp run docs:build
      - run: vp run --filter vitehub-docs test:artifact
      - name: Verify Worker bundle
        run: ./.github/ci-tools/node_modules/.bin/wrangler deploy --dry-run --config docs/.output/server/wrangler.json
      - name: Upload Worker bundle
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitehub-docs-output
          path: docs/.output
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # The docs site deploys from the verified bundle on every push to main. The Production environment holds the Cloudflare token.
  docs-deploy:
    name: docs deploy
    needs:
      - checks
      - docs
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Production
      url: https://vitehub.dev
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Download Worker bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vitehub-docs-output
          path: docs/.output

      - name: Deploy vitehub.dev
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          for required in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            if [ -z "${!required}" ]; then
              echo "Docs deploy needs the $required secret in the Production environment." >&2
              exit 1
            fi
          done
          ./.github/ci-tools/node_modules/.bin/wrangler deploy --config docs/.output/server/wrangler.json

      - name: Check the live site
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 30 -o /dev/null "https://vitehub.dev/raw/docs/getting-started.md?deploy=${GITHUB_SHA}"; then
              echo "vitehub.dev serves ${GITHUB_SHA}."
              exit 0
            fi
            sleep 10
          done
          echo "vitehub.dev did not answer after the deploy." >&2
          exit 1

  verify-providers:
    name: verify providers
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      srh:
        image: hiett/serverless-redis-http@sha256:65128347949bca511e448fd7238780d624573d74c22b79155a7563db19e9b678 # 0.0.10
        env:
          SRH_MODE: env
          SRH_TOKEN: local-srh-token
          SRH_CONNECTION_STRING: redis://redis:6379
        ports:
          - 8079:80
      sqld:
        image: ghcr.io/tursodatabase/libsql-server@sha256:6dd3eb276d9d3604e4a48ac4a999a2e267814732d57d7e94c04ba71482333a67 # revision d6c75af (2026-08-23)
        ports:
          - 8080:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Cloudflare output contract
        run: vp run test:output:cloudflare
      - name: Cloudflare local run
        run: vp run e2e:local --provider cloudflare
      - name: Vercel output contract
        run: vp run test:output:vercel
      - name: Vercel local run
        run: vp run e2e:local --provider vercel
        env:
          KV_REST_API_TOKEN: local-srh-token
          KV_REST_API_URL: http://127.0.0.1:8079
          TURSO_DATABASE_URL: http://127.0.0.1:8080
      - name: Install Netlify CLI
        run: npm install -g netlify-cli@23.15.1
      - name: Netlify end-to-end
        run: vp run e2e:netlify
