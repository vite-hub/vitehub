name: docs-bundle-size-comment

# Runs from main with a write token, also for fork pull requests. It only parses the reports of the pull request's
# build with nuxt-bundle-analyzer and never runs its code. GitHub triggers `workflow_run` only from the default branch,
# so the first comment appears after this file is on main.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows:
      - docs-bundle-size
    types:
      - completed

permissions: {}

env:
  NUXT_BUNDLE_ANALYZER_VERSION: 0.2.0

jobs:
  comment:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      # Proves to bundle.nuxt.dev that the upload comes from this workflow on main.
      id-token: write
      pull-requests: write
    env:
      # Finds the pull request of the triggering run, also from a fork, and posts the comment.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Download the runs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: runs
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      # The comment still goes out without the comparison link when the upload fails.
      - name: Upload the runs to bundle.nuxt.dev
        id: upload
        continue-on-error: true
        run: npx --yes "nuxt-bundle-analyzer@$NUXT_BUNDLE_ANALYZER_VERSION" upload --runs runs --url https://bundle.nuxt.dev # zizmor: ignore[adhoc-packages]
      - name: Comment on the pull request
        run: npx --yes "nuxt-bundle-analyzer@$NUXT_BUNDLE_ANALYZER_VERSION" comment --runs runs --post --link "$LINK" # zizmor: ignore[adhoc-packages]
        env:
          LINK: ${{ steps.upload.outputs.url }}
