name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: npm-release
  cancel-in-progress: false
  queue: max

env:
  NODE_VERSION: 24

jobs:
  verify:
    name: verify release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact_digest: ${{ steps.release-artifact.outputs.artifact-digest }}
      artifact_name: ${{ steps.release.outputs.artifact_name }}
      npm_tag: ${{ steps.release.outputs.npm_tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version: "24"
          cache: true

      - uses: ./.github/actions/setup-deno

      - run: vp install --frozen-lockfile

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          publish=false
          version="0.0.0-dev.${GITHUB_RUN_ID}"

          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/v* ]]; then
            publish=true
            version="${GITHUB_REF_NAME#v}"
          fi

          npm_tag=latest
          prerelease=false
          if [[ "$version" == *"-alpha"* ]]; then
            npm_tag=alpha
            prerelease=true
          elif [[ "$version" == *"-beta"* ]]; then
            npm_tag=beta
            prerelease=true
          elif [[ "$version" == *"-rc"* ]]; then
            npm_tag=rc
            prerelease=true
          elif [[ "$version" == *"-"* ]]; then
            npm_tag=next
            prerelease=true
          fi

          artifact_name="release-packages-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          mkdir -p .release
          RELEASE_ARTIFACT_NAME="$artifact_name" \
          RELEASE_NPM_TAG="$npm_tag" \
          RELEASE_PRERELEASE="$prerelease" \
          RELEASE_PUBLISH="$publish" \
          RELEASE_VERSION="$version" \
          node <<'NODE'
          const { writeFileSync } = require("node:fs")

          writeFileSync(".release/release-metadata.json", `${JSON.stringify({
            artifactName: process.env.RELEASE_ARTIFACT_NAME,
            commit: process.env.GITHUB_SHA,
            npmTag: process.env.RELEASE_NPM_TAG,
            prerelease: process.env.RELEASE_PRERELEASE === "true",
            publish: process.env.RELEASE_PUBLISH === "true",
            ref: process.env.GITHUB_REF,
            refName: process.env.GITHUB_REF_NAME,
            runId: process.env.GITHUB_RUN_ID,
            version: process.env.RELEASE_VERSION,
          }, null, 2)}\n`)
          NODE

          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$npm_tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Apply release version
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          node <<'NODE'
          const { readdirSync, readFileSync, writeFileSync } = require("node:fs")
          const { join } = require("node:path")

          if (!process.env.RELEASE_VERSION) throw new Error("Missing release version")

          const manifests = []
          for (const entry of readdirSync("packages", { withFileTypes: true })) {
            if (!entry.isDirectory()) continue
            const path = join("packages", entry.name, "package.json")
            let manifest
            try {
              manifest = JSON.parse(readFileSync(path, "utf8"))
            }
            catch (error) {
              if (error.code === "ENOENT") continue
              throw error
            }
            if (manifest.private === true) continue
            manifests.push({ manifest, path })
          }

          const releaseNames = new Set(manifests.map(({ manifest }) => manifest.name))
          for (const { manifest, path } of manifests) {
            manifest.version = process.env.RELEASE_VERSION
            for (const section of ["dependencies", "devDependencies", "optionalDependencies", "peerDependencies"]) {
              for (const name of Object.keys(manifest[section] || {})) {
                if (releaseNames.has(name)) manifest[section][name] = process.env.RELEASE_VERSION
              }
            }
            writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`)
          }
          NODE

      - run: vp run lint
      - run: vp run typecheck
      - run: vp run test
      - run: vp run build

      - name: Pack immutable release tarballs
        run: |
          node .github/scripts/release-packages.mjs pack \
            --workspace . \
            --output .release/npm \
            --source-sha "$GITHUB_SHA" \
            --verify-reproducible

      - name: Verify exact release tarballs
        run: |
          node .github/scripts/release-packages.mjs verify \
            --manifest .release/npm/release-manifest.json \
            --workspace . \
            --source-sha "$GITHUB_SHA"

          while IFS= read -r tarball; do
            vp exec --filter @vite-hub/auth -- publint run "$tarball" --strict
          done < <(node .github/scripts/release-packages.mjs files --manifest .release/npm/release-manifest.json)

      - name: Test package contracts against exact release tarballs
        env:
          VITEHUB_RELEASE_MANIFEST: ${{ github.workspace }}/.release/npm/release-manifest.json
        run: vp run test:contracts

      - name: Test no-hoist consumers against exact release tarballs
        env:
          VITEHUB_RELEASE_MANIFEST: ${{ github.workspace }}/.release/npm/release-manifest.json
        run: vp run test:consumer

      - name: Dry-run npm package publish
        env:
          NPM_TAG: ${{ steps.release.outputs.npm_tag }}
        run: |
          node .github/scripts/release-packages.mjs publish \
            --manifest .release/npm/release-manifest.json \
            --tag "$NPM_TAG" \
            --source-sha "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --dry-run

      - name: Upload verified release workspace
        id: release-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          path: |
            .release/release-metadata.json
            .release/npm
          if-no-files-found: error
          include-hidden-files: true
          overwrite: false
          retention-days: 7

  publish-npm:
    name: publish npm packages
    needs: verify
    if: github.event_name == 'push' && needs.verify.outputs.publish == 'true' && github.repository == 'vite-hub/vitehub'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # Configure required reviewers and release-tag protection for this environment in repository settings.
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified release workspace
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: release-data

      - name: Checkout trusted release verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: trusted-source
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version: "24"
          cache: false

      - name: Verify release artifact metadata
        working-directory: release-data
        env:
          EXPECTED_ARTIFACT_NAME: ${{ needs.verify.outputs.artifact_name }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.verify.outputs.artifact_digest }}
          EXPECTED_NPM_TAG: ${{ needs.verify.outputs.npm_tag }}
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          node <<'NODE'
          const { readFileSync } = require("node:fs")
          const metadata = JSON.parse(readFileSync("release-metadata.json", "utf8"))

          if (!/^[a-f0-9]{64}$/.test(process.env.EXPECTED_ARTIFACT_DIGEST || "")) {
            throw new Error("Missing verified release artifact digest")
          }
          if (metadata.artifactName !== process.env.EXPECTED_ARTIFACT_NAME) throw new Error("Release artifact name does not match verification")
          if (metadata.commit !== process.env.GITHUB_SHA) throw new Error("Release artifact commit does not match this workflow")
          if (metadata.npmTag !== process.env.EXPECTED_NPM_TAG) throw new Error("Release artifact npm tag does not match verification")
          if (metadata.publish !== true) throw new Error("Release artifact is not publishable")
          if (metadata.ref !== process.env.GITHUB_REF) throw new Error("Release artifact ref does not match this workflow")
          if (metadata.runId !== process.env.GITHUB_RUN_ID) throw new Error("Release artifact run does not match this workflow")
          if (metadata.version !== process.env.EXPECTED_VERSION) throw new Error("Release artifact version does not match verification")
          NODE

      - name: Verify immutable release tarballs against trusted source
        env:
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          test "$(git -C trusted-source rev-parse HEAD)" = "$GITHUB_SHA"
          node trusted-source/.github/scripts/release-packages.mjs verify \
            --manifest release-data/npm/release-manifest.json \
            --source-sha "$GITHUB_SHA" \
            --workspace trusted-source \
            --workspace-version "$EXPECTED_VERSION"

      - name: Validate npm trusted publishing support
        run: |
          node --version
          npm --version
          node -e '
            const { execFileSync } = require("node:child_process")
            const version = execFileSync("npm", ["--version"], { encoding: "utf8" }).trim().split(".").map(Number)
            const supported = version[0] > 11 || (version[0] === 11 && (version[1] > 5 || (version[1] === 5 && version[2] >= 1)))
            if (!supported) {
              throw new Error(`npm ${version.join(".")} does not satisfy trusted publishing requirement >=11.5.1`)
            }
          '

      - name: Publish packages to npm
        env:
          NPM_TAG: ${{ needs.verify.outputs.npm_tag }}
        run: |
          node trusted-source/.github/scripts/release-packages.mjs publish \
            --manifest release-data/npm/release-manifest.json \
            --tag "$NPM_TAG" \
            --source-sha "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF"

  github-release:
    name: create GitHub release
    needs: [verify, publish-npm]
    if: github.event_name == 'push' && needs.verify.outputs.publish == 'true' && github.repository == 'vite-hub/vitehub'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: release-data

      - name: Create GitHub release
        working-directory: release-data
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_ARTIFACT_NAME: ${{ needs.verify.outputs.artifact_name }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.verify.outputs.artifact_digest }}
        run: |
          set -euo pipefail

          metadata=release-metadata.json
          artifact_commit="$(node -p "require('./${metadata}').commit")"
          artifact_name="$(node -p "require('./${metadata}').artifactName")"
          artifact_publish="$(node -p "require('./${metadata}').publish")"
          prerelease="$(node -p "require('./${metadata}').prerelease")"
          release_tag="$(node -p "require('./${metadata}').refName")"
          release_run_id="$(node -p "require('./${metadata}').runId")"

          if [[ ! "$EXPECTED_ARTIFACT_DIGEST" =~ ^[a-f0-9]{64}$ ]]; then
            echo "Missing verified release artifact digest." >&2
            exit 1
          fi
          if [[ "$artifact_name" != "$EXPECTED_ARTIFACT_NAME" || "$artifact_commit" != "$GITHUB_SHA" || "$artifact_publish" != "true" || "$release_run_id" != "$GITHUB_RUN_ID" || "$release_tag" != "$GITHUB_REF_NAME" ]]; then
            echo "Release artifact metadata does not match this workflow." >&2
            exit 1
          fi

          args=(--verify-tag --generate-notes)
          if [[ "$prerelease" == "true" ]]; then
            args+=(--prerelease)
          fi

          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "GitHub release $release_tag already exists."
          else
            gh release create "$release_tag" "${args[@]}"
          fi
