name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24

jobs:
  verify:
    name: verify release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact_digest: ${{ steps.release-artifact.outputs.artifact-digest }}
      artifact_name: ${{ steps.release.outputs.artifact_name }}
      npm_tag: ${{ steps.release.outputs.npm_tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version: "24"
          cache: true

      - uses: ./.github/actions/setup-deno

      - run: vp install --frozen-lockfile

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          publish=false
          version="0.0.0-dev.${GITHUB_RUN_ID}"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            publish=true
            version="${GITHUB_REF_NAME#v}"
          fi

          npm_tag=latest
          prerelease=false
          if [[ "$version" == *"-alpha"* ]]; then
            npm_tag=alpha
            prerelease=true
          elif [[ "$version" == *"-beta"* ]]; then
            npm_tag=beta
            prerelease=true
          elif [[ "$version" == *"-rc"* ]]; then
            npm_tag=rc
            prerelease=true
          elif [[ "$version" == *"-"* ]]; then
            npm_tag=next
            prerelease=true
          fi

          artifact_name="release-workspace-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          mkdir -p .release
          RELEASE_ARTIFACT_NAME="$artifact_name" \
          RELEASE_NPM_TAG="$npm_tag" \
          RELEASE_PRERELEASE="$prerelease" \
          RELEASE_PUBLISH="$publish" \
          RELEASE_VERSION="$version" \
          node <<'NODE'
          const { writeFileSync } = require("node:fs")

          writeFileSync(".release/release-metadata.json", `${JSON.stringify({
            artifactName: process.env.RELEASE_ARTIFACT_NAME,
            commit: process.env.GITHUB_SHA,
            npmTag: process.env.RELEASE_NPM_TAG,
            prerelease: process.env.RELEASE_PRERELEASE === "true",
            publish: process.env.RELEASE_PUBLISH === "true",
            ref: process.env.GITHUB_REF,
            refName: process.env.GITHUB_REF_NAME,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            runId: process.env.GITHUB_RUN_ID,
            version: process.env.RELEASE_VERSION,
          }, null, 2)}\n`)
          NODE

          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$npm_tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Apply release version
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          node <<'NODE'
          const { readdirSync, readFileSync, writeFileSync } = require("node:fs")
          const { join } = require("node:path")

          if (!process.env.RELEASE_VERSION) throw new Error("Missing release version")

          for (const entry of readdirSync("packages", { withFileTypes: true })) {
            if (!entry.isDirectory()) continue
            const path = join("packages", entry.name, "package.json")
            let manifest
            try {
              manifest = JSON.parse(readFileSync(path, "utf8"))
            }
            catch (error) {
              if (error.code === "ENOENT") continue
              throw error
            }
            if (manifest.private === true) continue
            manifest.version = process.env.RELEASE_VERSION
            writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`)
          }
          NODE

      - run: vp run lint
      - run: vp run typecheck
      - run: vp run test:contracts
      - run: vp run test
      - run: vp run test:consumer

      - name: Dry-run npm package publish
        env:
          NPM_TAG: ${{ steps.release.outputs.npm_tag }}
        run: |
          set -euo pipefail

          dry_run_package() {
            package_json="$1"
            private="$(node -p "require('./${package_json}').private === true ? 'true' : 'false'")"
            if [[ "$private" == "true" ]]; then
              return
            fi

            package_name="$(node -p "require('./${package_json}').name")"
            package_version="$(node -p "require('./${package_json}').version")"
            package_dir="${package_json%/package.json}"

            if npm view "${package_name}@${package_version}" version --json >/dev/null 2>&1; then
              echo "${package_name}@${package_version} is already published; skipping dry-run."
              return
            fi

            (
              cd "$package_dir"
              vp pm publish --dry-run --access public --tag "$NPM_TAG" --ignore-scripts --no-git-checks
            )
          }

          package_order="$(node .github/scripts/package-release-order.mjs)"
          while IFS= read -r package_json; do
            dry_run_package "$package_json"
          done <<< "$package_order"

          printf '%s\n' "$package_order" > .release/package-order.txt

      - name: Upload verified release workspace
        id: release-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          path: |
            .release/release-metadata.json
            .release/package-order.txt
            LICENSE
            package.json
            packages
            !packages/**/node_modules/**
            pnpm-lock.yaml
            pnpm-workspace.yaml
          if-no-files-found: error
          include-hidden-files: true
          overwrite: false
          retention-days: 7

  publish-npm:
    name: publish npm packages
    needs: verify
    if: github.event_name == 'push' && needs.verify.outputs.publish == 'true' && github.repository == 'vite-hub/vitehub'
    runs-on: ubuntu-latest
    # Configure required reviewers and release-tag protection for this environment in repository settings.
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified release workspace
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: release-workspace

      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version: "24"
          working-directory: release-workspace
          run-install: false
          cache: false

      - name: Verify release artifact metadata
        working-directory: release-workspace
        env:
          EXPECTED_ARTIFACT_NAME: ${{ needs.verify.outputs.artifact_name }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.verify.outputs.artifact_digest }}
          EXPECTED_NPM_TAG: ${{ needs.verify.outputs.npm_tag }}
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          node <<'NODE'
          const { readFileSync } = require("node:fs")
          const metadata = JSON.parse(readFileSync(".release/release-metadata.json", "utf8"))

          if (!/^[a-f0-9]{64}$/.test(process.env.EXPECTED_ARTIFACT_DIGEST || "")) {
            throw new Error("Missing verified release artifact digest")
          }
          if (metadata.artifactName !== process.env.EXPECTED_ARTIFACT_NAME) throw new Error("Release artifact name does not match verification")
          if (metadata.commit !== process.env.GITHUB_SHA) throw new Error("Release artifact commit does not match this workflow")
          if (metadata.npmTag !== process.env.EXPECTED_NPM_TAG) throw new Error("Release artifact npm tag does not match verification")
          if (metadata.publish !== true) throw new Error("Release artifact is not publishable")
          if (metadata.ref !== process.env.GITHUB_REF) throw new Error("Release artifact ref does not match this workflow")
          if (metadata.runId !== process.env.GITHUB_RUN_ID) throw new Error("Release artifact run does not match this workflow")
          if (metadata.version !== process.env.EXPECTED_VERSION) throw new Error("Release artifact version does not match verification")
          NODE

      - name: Restore local workspace links
        working-directory: release-workspace
        run: |
          node <<'NODE'
          const { mkdirSync, readdirSync, readFileSync, symlinkSync } = require("node:fs")
          const { dirname, join, relative } = require("node:path")

          const packagesDirectory = join(process.cwd(), "packages")
          const packages = readdirSync(packagesDirectory, { withFileTypes: true })
            .filter(entry => entry.isDirectory())
            .flatMap((entry) => {
              const directory = join(packagesDirectory, entry.name)
              try {
                return [{ directory, manifest: JSON.parse(readFileSync(join(directory, "package.json"), "utf8")) }]
              }
              catch (error) {
                if (error.code === "ENOENT") return []
                throw error
              }
            })

          const packageName = /^(?:vite-hub|@vite-hub\/[a-z0-9][a-z0-9._-]*)$/
          const directoriesByName = new Map()
          for (const pkg of packages) {
            if (!packageName.test(pkg.manifest.name)) throw new Error(`Invalid workspace package name: ${pkg.manifest.name}`)
            if (directoriesByName.has(pkg.manifest.name)) throw new Error(`Duplicate workspace package: ${pkg.manifest.name}`)
            directoriesByName.set(pkg.manifest.name, pkg.directory)
          }

          for (const pkg of packages) {
            const workspaceDependencies = new Set()
            for (const field of ["dependencies", "devDependencies", "optionalDependencies", "peerDependencies"]) {
              for (const [name, specifier] of Object.entries(pkg.manifest[field] || {})) {
                if (String(specifier).startsWith("workspace:")) workspaceDependencies.add(name)
              }
            }

            for (const name of workspaceDependencies) {
              if (!packageName.test(name)) throw new Error(`Invalid workspace dependency name: ${name}`)
              const target = directoriesByName.get(name)
              if (!target) throw new Error(`Missing workspace dependency: ${name}`)
              const [scope, dependency] = name.split("/")
              const link = join(pkg.directory, "node_modules", scope, dependency)
              mkdirSync(dirname(link), { recursive: true })
              symlinkSync(relative(dirname(link), target), link, "dir")
            }
          }
          NODE

      - name: Validate npm trusted publishing support
        run: |
          node --version
          npm --version
          node -e '
            const { execFileSync } = require("node:child_process")
            const version = execFileSync("npm", ["--version"], { encoding: "utf8" }).trim().split(".").map(Number)
            const supported = version[0] > 11 || (version[0] === 11 && (version[1] > 5 || (version[1] === 5 && version[2] >= 1)))
            if (!supported) {
              throw new Error(`npm ${version.join(".")} does not satisfy trusted publishing requirement >=11.5.1`)
            }
          '

      - name: Publish packages to npm
        working-directory: release-workspace
        env:
          NPM_TAG: ${{ needs.verify.outputs.npm_tag }}
        run: |
          set -euo pipefail

          if [[ ! -s .release/package-order.txt ]]; then
            echo "Verified package order is empty." >&2
            exit 1
          fi

          publish_package() {
            package_json="$1"
            private="$(node -p "require('./${package_json}').private === true ? 'true' : 'false'")"
            if [[ "$private" == "true" ]]; then
              return
            fi

            package_name="$(node -p "require('./${package_json}').name")"
            package_version="$(node -p "require('./${package_json}').version")"
            package_dir="${package_json%/package.json}"

            if npm view "${package_name}@${package_version}" version --json >/dev/null 2>&1; then
              echo "${package_name}@${package_version} is already published; skipping."
              return
            fi

            (
              cd "$package_dir"
              vp pm publish --access public --tag "$NPM_TAG" --ignore-scripts --no-git-checks
            )
          }

          while IFS= read -r package_json; do
            if [[ ! "$package_json" =~ ^packages/[a-z0-9][a-z0-9-]*/package\.json$ || ! -f "$package_json" ]]; then
              echo "Invalid verified package path: $package_json" >&2
              exit 1
            fi
            publish_package "$package_json"
          done < .release/package-order.txt

  github-release:
    name: create GitHub release
    needs: [verify, publish-npm]
    if: github.event_name == 'push' && needs.verify.outputs.publish == 'true' && github.repository == 'vite-hub/vitehub'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: release-workspace

      - name: Create GitHub release
        working-directory: release-workspace
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_ARTIFACT_NAME: ${{ needs.verify.outputs.artifact_name }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.verify.outputs.artifact_digest }}
        run: |
          set -euo pipefail

          metadata=.release/release-metadata.json
          artifact_commit="$(node -p "require('./${metadata}').commit")"
          artifact_name="$(node -p "require('./${metadata}').artifactName")"
          artifact_publish="$(node -p "require('./${metadata}').publish")"
          prerelease="$(node -p "require('./${metadata}').prerelease")"
          release_tag="$(node -p "require('./${metadata}').refName")"
          release_run_id="$(node -p "require('./${metadata}').runId")"

          if [[ ! "$EXPECTED_ARTIFACT_DIGEST" =~ ^[a-f0-9]{64}$ ]]; then
            echo "Missing verified release artifact digest." >&2
            exit 1
          fi
          if [[ "$artifact_name" != "$EXPECTED_ARTIFACT_NAME" || "$artifact_commit" != "$GITHUB_SHA" || "$artifact_publish" != "true" || "$release_run_id" != "$GITHUB_RUN_ID" || "$release_tag" != "$GITHUB_REF_NAME" ]]; then
            echo "Release artifact metadata does not match this workflow." >&2
            exit 1
          fi

          args=(--verify-tag --generate-notes)
          if [[ "$prerelease" == "true" ]]; then
            args+=(--prerelease)
          fi

          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "GitHub release $release_tag already exists."
          else
            gh release create "$release_tag" "${args[@]}"
          fi
