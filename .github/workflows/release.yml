name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: npm-release
  cancel-in-progress: false
  queue: max

env:
  NODE_VERSION: 24

jobs:
  verify:
    name: verify release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact_digest: ${{ steps.release-artifact.outputs.artifact-digest }}
      artifact_name: ${{ steps.release.outputs.artifact_name }}
      npm_tag: ${{ steps.verified.outputs.npm-tag }}
      prerelease: ${{ steps.verified.outputs.prerelease }}
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.verified.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          publish=false
          version="0.0.0-dev.${GITHUB_RUN_ID}"

          if [[ "$GITHUB_REF" == refs/tags/v* && ( "$GITHUB_EVENT_NAME" == "push" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ) ]]; then
            publish=true
            version="${GITHUB_REF_NAME#v}"
          fi

          artifact_name="release-packages-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          {
            echo "artifact_name=$artifact_name"
            echo "publish=$publish"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      # The pre-tag jobs in release-pr.yml run this same action at the
      # reviewed commit and version before they create the tag.
      - name: Verify the exact release
        id: verified
        uses: ./.github/actions/verify-release
        with:
          version: ${{ steps.release.outputs.version }}
          exact: ${{ steps.release.outputs.publish }}
          source-sha: ${{ github.sha }}

      - name: Write release metadata
        env:
          RELEASE_ARTIFACT_NAME: ${{ steps.release.outputs.artifact_name }}
          RELEASE_NPM_TAG: ${{ steps.verified.outputs.npm-tag }}
          RELEASE_PRERELEASE: ${{ steps.verified.outputs.prerelease }}
          RELEASE_PUBLISH: ${{ steps.release.outputs.publish }}
          RELEASE_VERSION: ${{ steps.verified.outputs.version }}
        run: |
          node <<'NODE'
          const { writeFileSync } = require("node:fs")

          writeFileSync(".release/release-metadata.json", `${JSON.stringify({
            artifactName: process.env.RELEASE_ARTIFACT_NAME,
            commit: process.env.GITHUB_SHA,
            npmTag: process.env.RELEASE_NPM_TAG,
            prerelease: process.env.RELEASE_PRERELEASE === "true",
            publish: process.env.RELEASE_PUBLISH === "true",
            ref: process.env.GITHUB_REF,
            refName: process.env.GITHUB_REF_NAME,
            runId: process.env.GITHUB_RUN_ID,
            version: process.env.RELEASE_VERSION,
          }, null, 2)}\n`)
          NODE

      - name: Upload verified release workspace
        id: release-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          path: |
            .release/release-metadata.json
            .release/npm
          if-no-files-found: error
          include-hidden-files: true
          overwrite: false
          retention-days: 35

  publish-npm:
    name: publish npm packages
    needs: verify
    if: needs.verify.outputs.publish == 'true' && github.repository == 'vite-hub/vitehub'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # Configure required reviewers and release-tag protection for this environment in repository settings.
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified release workspace
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: release-data

      - name: Checkout trusted release verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: trusted-source
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "24"
          working-directory: trusted-source
          run-install: false
          cache: false

      - name: Verify release artifact metadata
        working-directory: release-data
        env:
          EXPECTED_ARTIFACT_NAME: ${{ needs.verify.outputs.artifact_name }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.verify.outputs.artifact_digest }}
          EXPECTED_NPM_TAG: ${{ needs.verify.outputs.npm_tag }}
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          node <<'NODE'
          const { readFileSync } = require("node:fs")
          const metadata = JSON.parse(readFileSync("release-metadata.json", "utf8"))

          if (!/^[a-f0-9]{64}$/.test(process.env.EXPECTED_ARTIFACT_DIGEST || "")) {
            throw new Error("Missing verified release artifact digest")
          }
          if (metadata.artifactName !== process.env.EXPECTED_ARTIFACT_NAME) throw new Error("Release artifact name does not match verification")
          if (metadata.commit !== process.env.GITHUB_SHA) throw new Error("Release artifact commit does not match this workflow")
          if (metadata.npmTag !== process.env.EXPECTED_NPM_TAG) throw new Error("Release artifact npm tag does not match verification")
          if (metadata.publish !== true) throw new Error("Release artifact is not publishable")
          if (metadata.ref !== process.env.GITHUB_REF) throw new Error("Release artifact ref does not match this workflow")
          if (metadata.runId !== process.env.GITHUB_RUN_ID) throw new Error("Release artifact run does not match this workflow")
          if (metadata.version !== process.env.EXPECTED_VERSION) throw new Error("Release artifact version does not match verification")
          NODE

      - name: Verify immutable release tarballs against trusted source
        env:
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          test "$(git -C trusted-source rev-parse HEAD)" = "$GITHUB_SHA"
          node trusted-source/.github/scripts/release-packages.mjs verify \
            --manifest release-data/npm/release-manifest.json \
            --source-sha "$GITHUB_SHA" \
            --workspace trusted-source \
            --workspace-version "$EXPECTED_VERSION"

      - name: Validate npm trusted publishing support
        run: |
          node --version
          npm --version
          # shellcheck disable=SC2016 # The single quotes hold JavaScript, not shell.
          node -e '
            const { execFileSync } = require("node:child_process")
            const version = execFileSync("npm", ["--version"], { encoding: "utf8" }).trim().split(".").map(Number)
            const supported = version[0] > 11 || (version[0] === 11 && (version[1] > 5 || (version[1] === 5 && version[2] >= 1)))
            if (!supported) {
              throw new Error(`npm ${version.join(".")} does not satisfy trusted publishing requirement >=11.5.1`)
            }
          '

      - name: Revalidate release tag
        working-directory: release-data
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          artifact_commit="$(node -p "require('./release-metadata.json').commit")"
          live_tag_commit="$(gh api "repos/${GH_REPO}/commits/${GITHUB_REF_NAME}" --jq .sha)"
          if [[ "$live_tag_commit" != "$artifact_commit" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} no longer points to verified commit ${artifact_commit}." >&2
            exit 1
          fi

      - name: Publish packages to npm
        env:
          NPM_TAG: ${{ needs.verify.outputs.npm_tag }}
        run: |
          node trusted-source/.github/scripts/release-packages.mjs publish \
            --manifest release-data/npm/release-manifest.json \
            --tag "$NPM_TAG" \
            --source-sha "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF"

  github-release:
    name: create GitHub release
    needs: [verify, publish-npm]
    if: needs.verify.outputs.publish == 'true' && github.repository == 'vite-hub/vitehub'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: release-data

      - name: Create GitHub release
        working-directory: release-data
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_ARTIFACT_NAME: ${{ needs.verify.outputs.artifact_name }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.verify.outputs.artifact_digest }}
        run: |
          set -euo pipefail

          metadata=release-metadata.json
          artifact_commit="$(node -p "require('./${metadata}').commit")"
          artifact_name="$(node -p "require('./${metadata}').artifactName")"
          artifact_publish="$(node -p "require('./${metadata}').publish")"
          prerelease="$(node -p "require('./${metadata}').prerelease")"
          release_tag="$(node -p "require('./${metadata}').refName")"
          release_run_id="$(node -p "require('./${metadata}').runId")"

          if [[ ! "$EXPECTED_ARTIFACT_DIGEST" =~ ^[a-f0-9]{64}$ ]]; then
            echo "Missing verified release artifact digest." >&2
            exit 1
          fi
          if [[ "$artifact_name" != "$EXPECTED_ARTIFACT_NAME" || "$artifact_commit" != "$GITHUB_SHA" || "$artifact_publish" != "true" || "$release_run_id" != "$GITHUB_RUN_ID" || "$release_tag" != "$GITHUB_REF_NAME" ]]; then
            echo "Release artifact metadata does not match this workflow." >&2
            exit 1
          fi

          live_tag_commit="$(gh api "repos/${GH_REPO}/commits/${release_tag}" --jq .sha)"
          if [[ "$live_tag_commit" != "$artifact_commit" ]]; then
            echo "Release tag ${release_tag} no longer points to verified commit ${artifact_commit}." >&2
            exit 1
          fi

          args=(--verify-tag)
          if [[ "$prerelease" == "true" ]]; then
            args+=(--prerelease)
          fi

          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "GitHub release $release_tag already exists."
          else
            notes="$(gh api "repos/${GH_REPO}/releases/generate-notes" -f "tag_name=${release_tag}" --jq .body)"
            # GitHub rejects release bodies over 125000 characters. Keep only GitHub's compare line, which picks the previous tag, prereleases included.
            if (( ${#notes} > 120000 )); then
              notes="$(grep -m1 '^\*\*Full Changelog\*\*: ' <<< "$notes" || echo "**Full Changelog**: https://github.com/${GH_REPO}/commits/${release_tag}")"
            fi
            printf '%s\n' "$notes" | gh release create "$release_tag" "${args[@]}" --notes-file -
          fi
