name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.3

      - name: Validate npm trusted publishing support
        run: |
          node --version
          npm --version
          node -e '
            const { execFileSync } = require("node:child_process")
            const version = execFileSync("npm", ["--version"], { encoding: "utf8" }).trim().split(".").map(Number)
            const supported = version[0] > 11 || (version[0] === 11 && (version[1] > 5 || (version[1] === 5 && version[2] >= 1)))
            if (!supported) {
              throw new Error(`npm ${version.join(".")} does not satisfy trusted publishing requirement >=11.5.1`)
            }
          '

      - run: vp install --frozen-lockfile

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          publish=false
          version="0.0.0-dev.${GITHUB_RUN_ID}"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            publish=true
            version="${GITHUB_REF_NAME#v}"
          fi

          npm_tag=latest
          prerelease=false
          if [[ "$version" == *"-alpha"* ]]; then
            npm_tag=alpha
            prerelease=true
          elif [[ "$version" == *"-beta"* ]]; then
            npm_tag=beta
            prerelease=true
          elif [[ "$version" == *"-rc"* ]]; then
            npm_tag=rc
            prerelease=true
          elif [[ "$version" == *"-"* ]]; then
            npm_tag=next
            prerelease=true
          fi

          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$npm_tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Apply release version
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          node <<'NODE'
          const { readdirSync, readFileSync, writeFileSync } = require("node:fs")
          const { join } = require("node:path")

          if (!process.env.RELEASE_VERSION) throw new Error("Missing release version")

          for (const entry of readdirSync("packages", { withFileTypes: true })) {
            if (!entry.isDirectory()) continue
            const path = join("packages", entry.name, "package.json")
            let manifest
            try {
              manifest = JSON.parse(readFileSync(path, "utf8"))
            }
            catch (error) {
              if (error.code === "ENOENT") continue
              throw error
            }
            if (manifest.private === true) continue
            manifest.version = process.env.RELEASE_VERSION
            writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`)
          }
          NODE

      - run: vp run lint
      - run: vp run typecheck
      - run: vp run test:contracts
      - run: vp run test
      - run: vp run test:consumer

      - name: Dry-run npm package publish
        env:
          NPM_TAG: ${{ steps.release.outputs.npm_tag }}
        run: |
          set -euo pipefail

          dry_run_package() {
            package_json="$1"
            private="$(node -p "require('./${package_json}').private === true ? 'true' : 'false'")"
            if [[ "$private" == "true" ]]; then
              return
            fi

            package_name="$(node -p "require('./${package_json}').name")"
            package_version="$(node -p "require('./${package_json}').version")"
            package_dir="${package_json%/package.json}"

            if npm view "${package_name}@${package_version}" version --json >/dev/null 2>&1; then
              echo "${package_name}@${package_version} is already published; skipping dry-run."
              return
            fi

            (
              cd "$package_dir"
              vp pm publish --dry-run --access public --tag "$NPM_TAG" --no-git-checks
            )
          }

          package_order="$(node .github/scripts/package-release-order.mjs)"
          while IFS= read -r package_json; do
            dry_run_package "$package_json"
          done <<< "$package_order"

      - name: Publish packages to npm
        if: steps.release.outputs.publish == 'true'
        env:
          NPM_TAG: ${{ steps.release.outputs.npm_tag }}
        run: |
          set -euo pipefail

          publish_package() {
            package_json="$1"
            private="$(node -p "require('./${package_json}').private === true ? 'true' : 'false'")"
            if [[ "$private" == "true" ]]; then
              return
            fi

            package_name="$(node -p "require('./${package_json}').name")"
            package_version="$(node -p "require('./${package_json}').version")"
            package_dir="${package_json%/package.json}"

            if npm view "${package_name}@${package_version}" version --json >/dev/null 2>&1; then
              echo "${package_name}@${package_version} is already published; skipping."
              return
            fi

            (
              cd "$package_dir"
              vp pm publish --access public --tag "$NPM_TAG" --no-git-checks
            )
          }

          package_order="$(node .github/scripts/package-release-order.mjs)"
          while IFS= read -r package_json; do
            publish_package "$package_json"
          done <<< "$package_order"

      - name: Create GitHub release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--verify-tag --generate-notes)
          if [[ "${{ steps.release.outputs.prerelease }}" == "true" ]]; then
            args+=(--prerelease)
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub release $GITHUB_REF_NAME already exists."
          else
            gh release create "$GITHUB_REF_NAME" "${args[@]}"
          fi
