name: deploy docs

on:
  push:
    branches:
      - main
    paths:
      - ".github/actions/setup/**"
      - ".github/workflows/deploy-docs.yml"
      - "docs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  pull_request:
    paths:
      - ".github/actions/setup/**"
      - ".github/workflows/deploy-docs.yml"
      - "docs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'pull_request'
    name: cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Build docs
        run: vp run --filter vitehub-docs build

      - name: Verify Worker bundle
        working-directory: docs
        run: vp dlx "wrangler@4.112.0" deploy --dry-run --config .output/server/wrangler.json

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    name: deploy cloudflare
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Test docs
        run: vp run --filter vitehub-docs test

      - name: Resolve D1 database
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          response="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?name=vitehub-docs")"
          database_id="$(jq -r '.result[0].uuid // empty' <<<"${response}")"
          if [ -z "${database_id}" ]; then
            response="$(curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header "Content-Type: application/json" \
              --data '{"name":"vitehub-docs"}' \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database")"
            database_id="$(jq -r '.result.uuid // empty' <<<"${response}")"
          fi
          test -n "${database_id}"
          echo "CLOUDFLARE_D1_DATABASE_ID=${database_id}" >> "$GITHUB_ENV"

      - name: Build docs
        run: vp run --filter vitehub-docs build

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs
          wranglerVersion: "4.112.0"
          command: deploy --config .output/server/wrangler.json
