name: live smoke

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

concurrency:
  group: live-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_CLI_VERSION: 54.5.1

jobs:
  setup-cloudflare:
    name: setup
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Build vitehub packages
        run: vp run build

      - name: Upload package builds
        uses: actions/upload-artifact@v6
        with:
          name: vitehub-package-dist
          path: |
            packages/*/dist
          retention-days: 1
          if-no-files-found: error

  live-smoke:
    name: live smoke
    needs: setup-cloudflare
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        provider: [cloudflare, vercel]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Download package builds
        uses: actions/download-artifact@v8
        with:
          name: vitehub-package-dist
          path: packages

      - name: Validate Cloudflare env
        if: matrix.provider == 'cloudflare'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ secrets.CLOUDFLARE_WORKERS_SUBDOMAIN }}
        run: |
          missing=()
          for required in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_WORKERS_SUBDOMAIN CLOUDFLARE_KV_NAMESPACE_ID; do
            if [ -z "${!required}" ]; then
              missing+=("$required")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Cloudflare secret verification failed: missing %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Prepare Vercel project
        id: prepare_vercel
        if: matrix.provider == 'vercel'
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          APP_DIR="playground/vite"
          PROJECT_NAME="vitehub-playground-vite"

          vp dlx "vercel@$VERCEL_CLI_VERSION" link --yes --cwd "$APP_DIR" --project "$PROJECT_NAME" --token "$VERCEL_TOKEN"

          readarray -t VERCEL_CONFIG < <(node -e 'const { readFileSync } = require("node:fs"); const { join } = require("node:path"); const config = JSON.parse(readFileSync(join(process.argv[1], ".vercel", "project.json"), "utf8")); console.log(config.orgId); console.log(config.projectId);' "$APP_DIR")
          VERCEL_ORG_ID="${VERCEL_CONFIG[0]}"
          VERCEL_PROJECT_ID="${VERCEL_CONFIG[1]}"

          if [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Failed to read linked Vercel project metadata." >&2
            exit 1
          fi

          PULLED_ENV_FILE="$(mktemp)"
          trap 'rm -f "$PULLED_ENV_FILE"' EXIT
          VERCEL_ORG_ID="$VERCEL_ORG_ID" VERCEL_PROJECT_ID="$VERCEL_PROJECT_ID" \
            vp dlx "vercel@$VERCEL_CLI_VERSION" env pull "$PULLED_ENV_FILE" --environment=production --yes --cwd "$APP_DIR" --token "$VERCEL_TOKEN" >/dev/null

          declare -A REQUIRED_ENV_KEYS=(
            [blob_token]=BLOB_READ_WRITE_TOKEN
            [kv_token]=KV_REST_API_TOKEN
            [kv_url]=KV_REST_API_URL
          )

          missing=()

          for output_name in "${!REQUIRED_ENV_KEYS[@]}"; do
            env_name="${REQUIRED_ENV_KEYS[$output_name]}"
            value="$(node .github/scripts/get-env-value.mjs "$PULLED_ENV_FILE" "$env_name")"
            fallback_value="${!env_name:-}"
            if [ -z "$value" ] && [ -n "$fallback_value" ]; then
              echo "::add-mask::$fallback_value"
              vp dlx "vercel@$VERCEL_CLI_VERSION" env add "$env_name" production --value "$fallback_value" --force --yes --cwd "$APP_DIR" --token "$VERCEL_TOKEN" >/dev/null
              value="$fallback_value"
            fi

            if [ -z "$value" ]; then
              missing+=("$env_name")
              continue
            fi

            echo "::add-mask::$value"
            printf -v "$output_name" "%s" "$value"
            {
              echo "${output_name}<<EOF"
              echo "$value"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Vercel production env verification failed: missing %s on the linked project and GitHub Production environment.\n' "${missing[*]}" >&2
            exit 1
          fi

          KV_URL="${kv_url:-}"
          case "$KV_URL" in
            https://*) ;;
            *)
              echo "Vercel production env verification failed: KV_REST_API_URL must start with https://." >&2
              exit 1
              ;;
          esac

          echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"
          echo "org_id=$VERCEL_ORG_ID" >> "$GITHUB_OUTPUT"
          echo "project_id=$VERCEL_PROJECT_ID" >> "$GITHUB_OUTPUT"

      - name: Provision Cloudflare resources
        if: matrix.provider == 'cloudflare'
        env:
          BLOB_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          VITEHUB_HOSTING: cloudflare
          VITEHUB_VITE_MODE: e2e
        run: vp run playground:vite:provision --provider cloudflare

      - name: Build playground (cloudflare)
        if: matrix.provider == 'cloudflare'
        env:
          BLOB_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          VITEHUB_CLOUDFLARE_WORKER_NAME: vitehub-playground-vite
          VITEHUB_HOSTING: cloudflare
          VITEHUB_VITE_MODE: e2e
        run: vp run playground:vite:build

      - name: Provider Output Contract (cloudflare)
        if: matrix.provider == 'cloudflare'
        run: vp test --config test/output/vitest.config.ts test/output/cloudflare.test.ts

      - name: Dry-run Cloudflare deploy
        if: matrix.provider == 'cloudflare'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: vp dlx wrangler --cwd playground/vite/dist/vite deploy --config wrangler.json --dry-run

      - name: Provision Vercel resources
        if: matrix.provider == 'vercel'
        env:
          VERCEL_PROJECT_ID: ${{ steps.prepare_vercel.outputs.project_id }}
          VERCEL_TEAM_ID: ${{ steps.prepare_vercel.outputs.org_id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VITEHUB_HOSTING: vercel
          VITEHUB_VITE_MODE: e2e
        run: vp run playground:vite:provision --provider vercel

      - name: Build playground (vercel)
        if: matrix.provider == 'vercel'
        env:
          BLOB_READ_WRITE_TOKEN: ${{ steps.prepare_vercel.outputs.blob_token }}
          KV_REST_API_TOKEN: ${{ steps.prepare_vercel.outputs.kv_token }}
          KV_REST_API_URL: ${{ steps.prepare_vercel.outputs.kv_url }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          VERCEL_PROJECT_ID: ${{ steps.prepare_vercel.outputs.project_id }}
          VERCEL_TEAM_ID: ${{ steps.prepare_vercel.outputs.org_id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VITEHUB_HOSTING: vercel
          VITEHUB_VITE_MODE: e2e
          VITEHUB_WORKSPACE_BLOB_PREFIX: vitehub/workspace-e2e/vite
        run: vp run playground:vite:build

      - name: Provider Output Contract (vercel)
        if: matrix.provider == 'vercel'
        run: vp test --config test/output/vitest.config.ts test/output/vercel.test.ts

      - name: Relax Vercel cron cadence for live deploy
        if: matrix.provider == 'vercel'
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs")
          const appDir = "${{ steps.prepare_vercel.outputs.app_dir }}"
          const configFile = `${appDir}/.vercel/output/config.json`
          const config = JSON.parse(readFileSync(configFile, "utf8"))
          if (Array.isArray(config.crons)) {
            config.crons = config.crons.map(cron => ({ ...cron, schedule: "0 0 * * *" }))
            writeFileSync(configFile, `${JSON.stringify(config, null, 2)}\n`)
          }
          NODE

      - name: Deploy Cloudflare
        id: deploy_cloudflare
        if: matrix.provider == 'cloudflare'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ secrets.CLOUDFLARE_WORKERS_SUBDOMAIN }}
        run: |
          WORKER_NAME="vitehub-playground-vite"
          DEPLOY_DIR="playground/vite/dist/vite"

          vp dlx wrangler --cwd "$DEPLOY_DIR" deploy --config wrangler.json --name "$WORKER_NAME"
          echo "url=https://${WORKER_NAME}.${CLOUDFLARE_WORKERS_SUBDOMAIN}.workers.dev" >> "$GITHUB_OUTPUT"
          echo "worker=$WORKER_NAME" >> "$GITHUB_OUTPUT"

      - name: Deploy Vercel
        id: deploy_vercel
        if: matrix.provider == 'vercel'
        env:
          VERCEL_ORG_ID: ${{ steps.prepare_vercel.outputs.org_id }}
          VERCEL_PROJECT_ID: ${{ steps.prepare_vercel.outputs.project_id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          APP_DIR="${{ steps.prepare_vercel.outputs.app_dir }}"
          set +e
          DEPLOYMENT_OUTPUT=$(VERCEL_ORG_ID="$VERCEL_ORG_ID" VERCEL_PROJECT_ID="$VERCEL_PROJECT_ID" vp dlx "vercel@$VERCEL_CLI_VERSION" deploy --cwd "$APP_DIR" --prebuilt --prod --yes --token "$VERCEL_TOKEN" 2>&1)
          DEPLOYMENT_STATUS=$?
          set -e
          printf '%s\n' "$DEPLOYMENT_OUTPUT"
          if [ "$DEPLOYMENT_STATUS" -ne 0 ]; then
            exit "$DEPLOYMENT_STATUS"
          fi
          DEPLOYMENT_URL=$(printf '%s\n' "$DEPLOYMENT_OUTPUT" | grep -Eo 'https://[^ ]+\.vercel\.app' | tail -n 1)
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "Failed to capture Vercel deployment URL." >&2
            exit 1
          fi

          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Resolve deployment URL
        id: url
        run: |
          if [ "${{ matrix.provider }}" = "cloudflare" ]; then
            echo "url=${{ steps.deploy_cloudflare.outputs.url }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=${{ steps.deploy_vercel.outputs.url }}" >> "$GITHUB_OUTPUT"
          fi

      - name: KV Live E2E (${{ matrix.provider }})
        run: vp run kv:e2e --mode live --provider ${{ matrix.provider }} --url "${{ steps.url.outputs.url }}"

      - name: Queue Live E2E (${{ matrix.provider }})
        timeout-minutes: 5
        run: vp run queue:e2e --provider "${{ matrix.provider }}" --url "${{ steps.url.outputs.url }}"

      - name: Rate Limit Live E2E (cloudflare)
        if: matrix.provider == 'cloudflare'
        run: vp run rate-limit:e2e --mode live --provider cloudflare --url "${{ steps.url.outputs.url }}"

      - name: Schedule Live E2E (${{ matrix.provider }})
        timeout-minutes: 7
        run: vp run schedule:e2e --provider "${{ matrix.provider }}" --url "${{ steps.url.outputs.url }}" --timeout 270000

      - name: Sandbox Live E2E (${{ matrix.provider }})
        run: vp run sandbox:e2e --mode live --provider ${{ matrix.provider }} --url "${{ steps.url.outputs.url }}"

      - name: Workflow Live E2E (${{ matrix.provider }})
        timeout-minutes: 5
        run: vp run workflow:e2e --provider "${{ matrix.provider }}" --url "${{ steps.url.outputs.url }}"

      - name: Workspace Live E2E (${{ matrix.provider }})
        run: vp run workspace:e2e --mode live --provider ${{ matrix.provider }} --url "${{ steps.url.outputs.url }}"

      - name: Blob Live E2E
        env:
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
        run: vp run blob:e2e --mode live --url "${{ steps.url.outputs.url }}"

      - name: DB Live E2E
        run: vp run database:e2e --url "${{ steps.url.outputs.url }}"

  report-failure:
    name: report failure
    needs: [setup-cloudflare, live-smoke]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const title = "Live Smoke failure"
            const body = [
              `Nightly Live Smoke failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "Keep this issue open until a green scheduled run; close it then.",
            ].join("\n")
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo, labels: "live-smoke-failure", state: "open",
            })
            if (issues.length > 0) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issues[0].number, body })
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ["live-smoke-failure"] })
            }
