name: manual live e2e

on:
  workflow_dispatch:

concurrency:
  group: manual-live-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup-cloudflare:
    name: setup
    runs-on: ubuntu-latest
    environment: Production
    outputs:
      d1_analytics_database_id: ${{ steps.ensure_cloudflare.outputs.d1_analytics_database_id }}
      d1_database_id: ${{ steps.ensure_cloudflare.outputs.d1_database_id }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Build vitehub packages
        run: pnpm -r --filter './packages/*' --if-present build

      - name: Upload package builds
        uses: actions/upload-artifact@v6
        with:
          name: vitehub-package-dist
          path: |
            packages/*/dist
          retention-days: 1
          if-no-files-found: error

      - name: Ensure Cloudflare Resources
        id: ensure_cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
        run: |
          QUEUES="queue--77656c636f6d65 queue--77656c636f6d652d656d61696c"
          export QUEUES

          for queue in $QUEUES; do
            if ! npx wrangler queues list | grep -q "$queue"; then
              npx wrangler queues create "$queue"
            fi
          done

          if [ -n "$CLOUDFLARE_R2_BUCKET_NAME" ] && ! npx wrangler r2 bucket list | grep -q "$CLOUDFLARE_R2_BUCKET_NAME"; then
            npx wrangler r2 bucket create "$CLOUDFLARE_R2_BUCKET_NAME"
          fi

          d1_id_for_name() {
            npx wrangler d1 list --json | node -e '
              const fs = require("node:fs")
              const name = process.argv[1]
              const databases = JSON.parse(fs.readFileSync(0, "utf8"))
              const match = databases.find((database) => database.name === name)
              process.stdout.write(match?.uuid || match?.database_id || match?.id || "")
            ' "$1"
          }

          ensure_d1() {
            local name id
            name="$1"
            id="$(d1_id_for_name "$name")"
            if [ -z "$id" ]; then
              npx wrangler d1 create "$name" >&2
              id="$(d1_id_for_name "$name")"
            fi
            if [ -z "$id" ]; then
              echo "Failed to resolve Cloudflare D1 database id for $name." >&2
              exit 1
            fi
            printf '%s' "$id"
          }

          primary_d1_id="$(ensure_d1 vitehub-playground-db)"
          analytics_d1_id="$(ensure_d1 vitehub-playground-analytics)"
          echo "d1_database_id=$primary_d1_id" >> "$GITHUB_OUTPUT"
          echo "d1_analytics_database_id=$analytics_d1_id" >> "$GITHUB_OUTPUT"

  live-e2e:
    name: live e2e
    needs: setup-cloudflare
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        framework: [vite, nitro]
        provider: [cloudflare, vercel]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Download package builds
        uses: actions/download-artifact@v8
        with:
          name: vitehub-package-dist
          path: packages

      - name: Validate Cloudflare env
        if: matrix.provider == 'cloudflare'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ secrets.CLOUDFLARE_WORKERS_SUBDOMAIN }}
        run: |
          missing=()
          for required in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_WORKERS_SUBDOMAIN CLOUDFLARE_KV_NAMESPACE_ID; do
            if [ -z "${!required}" ]; then
              missing+=("$required")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Cloudflare secret verification failed: missing %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Prepare Vercel project
        id: prepare_vercel
        if: matrix.provider == 'vercel'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          APP_DIR="playground/${{ matrix.framework }}"
          PROJECT_NAME="vitehub-playground-${{ matrix.framework }}"

          npx vercel link --yes --cwd "$APP_DIR" --project "$PROJECT_NAME" --token "$VERCEL_TOKEN"

          readarray -t VERCEL_CONFIG < <(node -e 'const { readFileSync } = require("node:fs"); const { join } = require("node:path"); const config = JSON.parse(readFileSync(join(process.argv[1], ".vercel", "project.json"), "utf8")); console.log(config.orgId); console.log(config.projectId);' "$APP_DIR")
          VERCEL_ORG_ID="${VERCEL_CONFIG[0]}"
          VERCEL_PROJECT_ID="${VERCEL_CONFIG[1]}"

          if [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Failed to read linked Vercel project metadata." >&2
            exit 1
          fi

          PULLED_ENV_FILE="$(mktemp)"
          trap 'rm -f "$PULLED_ENV_FILE"' EXIT
          VERCEL_ORG_ID="$VERCEL_ORG_ID" VERCEL_PROJECT_ID="$VERCEL_PROJECT_ID" \
            npx vercel env pull "$PULLED_ENV_FILE" --environment=production --yes --cwd "$APP_DIR" --token "$VERCEL_TOKEN" >/dev/null

          find_project_blob_token() {
            local app_dir project_name env_name tmp value
            local -a SEARCH_CONFIG
            app_dir="$1"
            project_name="$2"

            npx vercel link --yes --cwd "$app_dir" --project "$project_name" --token "$VERCEL_TOKEN" >/dev/null 2>&1 || return 1
            readarray -t SEARCH_CONFIG < <(node -e 'const { readFileSync } = require("node:fs"); const { join } = require("node:path"); const config = JSON.parse(readFileSync(join(process.argv[1], ".vercel", "project.json"), "utf8")); console.log(config.orgId); console.log(config.projectId);' "$app_dir")

            for env_name in production preview development; do
              tmp="$(mktemp)"
              if VERCEL_ORG_ID="${SEARCH_CONFIG[0]}" VERCEL_PROJECT_ID="${SEARCH_CONFIG[1]}" \
                npx vercel env pull "$tmp" --environment="$env_name" --yes --cwd "$app_dir" --token "$VERCEL_TOKEN" >/dev/null 2>&1; then
                value="$(node .github/scripts/get-env-value.mjs "$tmp" BLOB_READ_WRITE_TOKEN)"
                rm -f "$tmp"
                if [ -n "$value" ]; then
                  printf '%s' "$value"
                  return 0
                fi
              else
                rm -f "$tmp"
              fi
            done
            return 1
          }

          find_existing_blob_token() {
            local sibling_framework sibling_dir sibling_project

            find_project_blob_token "$APP_DIR" "$PROJECT_NAME" && return 0

            if [ "${{ matrix.framework }}" = "vite" ]; then
              sibling_framework="nitro"
            else
              sibling_framework="vite"
            fi
            sibling_dir="playground/$sibling_framework"
            sibling_project="vitehub-playground-$sibling_framework"
            find_project_blob_token "$sibling_dir" "$sibling_project"
          }

          declare -A REQUIRED_ENV_KEYS=(
            [blob_token]=BLOB_READ_WRITE_TOKEN
            [kv_token]=KV_REST_API_TOKEN
            [kv_url]=KV_REST_API_URL
          )

          blob_token="$(node .github/scripts/get-env-value.mjs "$PULLED_ENV_FILE" BLOB_READ_WRITE_TOKEN)"
          if [ -z "$blob_token" ]; then
            existing_blob_token="$(find_existing_blob_token || true)"
            if [ -n "$existing_blob_token" ]; then
              echo "::add-mask::$existing_blob_token"
              blob_token="$existing_blob_token"
              printf '%s' "$existing_blob_token" | npx vercel env add BLOB_READ_WRITE_TOKEN production --force --sensitive --cwd "$APP_DIR" --token "$VERCEL_TOKEN" >/dev/null
            else
              create_log="$(mktemp)"
              if ! npx vercel blob create-store "vitehub-workspace-${{ matrix.framework }}" --access private --region iad1 --yes --environment production --cwd "$APP_DIR" --token "$VERCEL_TOKEN" >"$create_log" 2>&1; then
                if ! grep -q 'existing environment variable with name BLOB_READ_WRITE_TOKEN' "$create_log"; then
                  cat "$create_log" >&2
                  exit 1
                fi
              fi
              rm -f "$create_log"
            fi
            VERCEL_ORG_ID="$VERCEL_ORG_ID" VERCEL_PROJECT_ID="$VERCEL_PROJECT_ID" \
              npx vercel env pull "$PULLED_ENV_FILE" --environment=production --yes --cwd "$APP_DIR" --token "$VERCEL_TOKEN" >/dev/null
            if [ -z "$blob_token" ]; then
              blob_token="$(node .github/scripts/get-env-value.mjs "$PULLED_ENV_FILE" BLOB_READ_WRITE_TOKEN)"
            fi
          fi

          missing=()

          for output_name in "${!REQUIRED_ENV_KEYS[@]}"; do
            env_name="${REQUIRED_ENV_KEYS[$output_name]}"
            value="$(node .github/scripts/get-env-value.mjs "$PULLED_ENV_FILE" "$env_name")"
            if [ "$env_name" = "BLOB_READ_WRITE_TOKEN" ] && [ -z "$value" ]; then
              value="$blob_token"
            fi

            if [ -z "$value" ]; then
              missing+=("$env_name")
              continue
            fi

            echo "::add-mask::$value"
            {
              echo "${output_name}<<EOF"
              echo "$value"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Vercel production env verification failed: missing %s on the linked project.\n' "${missing[*]}" >&2
            exit 1
          fi

          KV_URL="$(node .github/scripts/get-env-value.mjs "$PULLED_ENV_FILE" KV_REST_API_URL)"
          case "$KV_URL" in
            https://*) ;;
            *)
              echo "Vercel production env verification failed: KV_REST_API_URL must start with https://." >&2
              exit 1
              ;;
          esac

          echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"
          echo "org_id=$VERCEL_ORG_ID" >> "$GITHUB_OUTPUT"
          echo "project_id=$VERCEL_PROJECT_ID" >> "$GITHUB_OUTPUT"

      - name: Build Nitro (cloudflare)
        if: matrix.framework == 'nitro' && matrix.provider == 'cloudflare'
        env:
          KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          VITEHUB_HOSTING: cloudflare
        run: pnpm --dir playground/nitro exec nitro build --preset cloudflare-module

      - name: Assert Nitro Cloudflare bindings
        if: matrix.framework == 'nitro' && matrix.provider == 'cloudflare'
        run: |
          node <<'NODE'
          const { existsSync, readFileSync, readdirSync, statSync } = require("node:fs")
          const wrangler = JSON.parse(readFileSync("playground/nitro/.output/server/wrangler.json", "utf8"))
          if (!Array.isArray(wrangler.triggers?.crons) || !wrangler.triggers.crons.includes("* * * * *")) {
            throw new Error("Expected Nitro Cloudflare wrangler.json to include the daily-marker schedule cron trigger.")
          }
          if (!Array.isArray(wrangler.kv_namespaces) || wrangler.kv_namespaces.length === 0) {
            throw new Error("Expected Nitro Cloudflare wrangler.json to include kv_namespaces.")
          }
          if (typeof wrangler.artifacts !== "undefined") {
            throw new Error("Nitro Cloudflare wrangler.json must not include Workspace Artifacts bindings.")
          }
          const { join, posix, relative } = require("node:path")
          const root = "playground/nitro/.output/server"
          const files = []
          const visit = (dir) => {
            for (const entry of readdirSync(dir)) {
              const path = join(dir, entry)
              if (statSync(path).isDirectory()) visit(path)
              else if (path.endsWith(".mjs") || path.endsWith(".js")) files.push(path)
            }
          }
          visit(root)
          for (const file of files) {
            const source = readFileSync(file, "utf8")
            if (source.includes("@vitejs/devtools")) {
              throw new Error(`Nitro Cloudflare output must not bundle Vite DevTools runtime code: ${file}`)
            }
            const imports = source.matchAll(/(?:from\s+|import\(|require\()\s*["']([^"']+)["']/g)
            for (const [, specifier] of imports) {
              if (specifier === "sprintf-js" || specifier === "turndown" || specifier === "@mixmark-io/domino") {
                throw new Error(`Unresolved bare dependency ${specifier} imported by ${file}`)
              }
              if (!specifier.includes("_libs/")) continue
              const resolved = specifier.startsWith(".")
                ? posix.normalize(posix.join(posix.dirname(relative(root, file).replace(/\\/g, "/")), specifier))
                : posix.normalize(specifier)
              const candidates = [join(root, resolved), join(root, `${resolved}.mjs`), join(root, `${resolved}.js`)]
              if (!candidates.some(existsSync)) {
                throw new Error(`Missing emitted module for ${specifier} imported by ${file}`)
              }
            }
          }
          NODE

      - name: Build Nitro (vercel)
        if: matrix.framework == 'nitro' && matrix.provider == 'vercel'
        env:
          VERCEL_ORG_ID: ${{ steps.prepare_vercel.outputs.org_id }}
          VERCEL_PROJECT_ID: ${{ steps.prepare_vercel.outputs.project_id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VITEHUB_HOSTING: vercel
        run: |
          APP_DIR="${{ steps.prepare_vercel.outputs.app_dir }}"
          VITEHUB_WORKSPACE_BLOB_PREFIX="vitehub/workspace-e2e/${{ matrix.framework }}" \
            npx vercel env run --cwd "$APP_DIR" --token "$VERCEL_TOKEN" -e production -- pnpm exec nitro build --preset vercel

      - name: Assert Nitro Vercel schedule artifacts
        if: matrix.framework == 'nitro' && matrix.provider == 'vercel'
        run: |
          node <<'NODE'
          const { existsSync, readFileSync } = require("node:fs")
          const config = JSON.parse(readFileSync("playground/nitro/.vercel/output/config.json", "utf8"))
          const expected = { path: "/api/vitehub/schedules/vercel/daily-marker", schedule: "* * * * *" }
          if (!Array.isArray(config.crons) || !config.crons.some(cron => cron.path === expected.path && cron.schedule === expected.schedule)) {
            throw new Error(`Expected Nitro Vercel config.json crons to include ${JSON.stringify(expected)}.`)
          }
          const functionFile = "playground/nitro/.vercel/output/functions/api/vitehub/schedules/vercel/daily-marker.func/index.mjs"
          if (!existsSync(functionFile)) {
            throw new Error(`Expected generated Nitro Vercel schedule function at ${functionFile}.`)
          }
          if (!readFileSync(functionFile, "utf8").includes("executeStaticSchedule")) {
            throw new Error("Expected Nitro Vercel schedule function to execute the static schedule handler.")
          }
          const serverConfig = JSON.parse(readFileSync("playground/nitro/.vercel/output/functions/__server.func/.vc-config.json", "utf8"))
          if (serverConfig.runtime !== "nodejs22.x") {
            throw new Error(`Expected Nitro Vercel server runtime nodejs22.x, got ${serverConfig.runtime}.`)
          }
          const serverBundle = readFileSync("playground/nitro/.vercel/output/functions/__server.func/index.mjs", "utf8")
          if (serverBundle.includes("@vitejs/devtools") || /import\(["']vite["']\)/.test(serverBundle)) {
            throw new Error("Nitro Vercel server bundle must not include Vite or Vite DevTools runtime code.")
          }
          NODE

      - name: Build Vite E2E (cloudflare)
        if: matrix.framework == 'vite' && matrix.provider == 'cloudflare'
        env:
          BLOB_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          VITEHUB_D1_ANALYTICS_DATABASE_ID: ${{ needs.setup-cloudflare.outputs.d1_analytics_database_id }}
          VITEHUB_D1_DATABASE_ID: ${{ needs.setup-cloudflare.outputs.d1_database_id }}
          VITEHUB_CLOUDFLARE_WORKER_NAME: vitehub-playground-vite
          VITEHUB_HOSTING: cloudflare
          VITEHUB_VITE_MODE: e2e
        run: pnpm --dir playground/vite build

      - name: Assert Vite Cloudflare artifact purity
        if: matrix.framework == 'vite' && matrix.provider == 'cloudflare'
        run: |
          node <<'NODE'
          const { readFileSync } = require("node:fs")
          const bundle = readFileSync("playground/vite/dist/vite/index.js", "utf8")
          if (/from\s+["']@vercel\/functions["']/.test(bundle) || /require\(["']@vercel\/functions["']\)/.test(bundle) || /import\(["']@vercel\/functions["']\)/.test(bundle)) {
            throw new Error("Cloudflare Vite bundle must not include @vercel/functions imports.")
          }
          if (/from\s+["']@vercel\/blob["']/.test(bundle) || /require\(["']@vercel\/blob["']\)/.test(bundle) || /import\(["']@vercel\/blob["']\)/.test(bundle)) {
            throw new Error("Cloudflare Vite bundle must not include @vercel/blob imports.")
          }
          if (/from\s+["']@cloudflare\/sandbox["']/.test(bundle) || /require\(["']@cloudflare\/sandbox["']\)/.test(bundle) || /import\(["']@cloudflare\/sandbox["']\)/.test(bundle)) {
            throw new Error("Cloudflare Vite bundle must not include bare @cloudflare/sandbox imports.")
          }
          if (bundle.includes("@vitejs/devtools") || /import\(["']vite["']\)/.test(bundle)) {
            throw new Error("Cloudflare Vite bundle must not include Vite or Vite DevTools runtime code.")
          }
          const wrangler = JSON.parse(readFileSync("playground/vite/dist/vite/wrangler.json", "utf8"))
          if (!Array.isArray(wrangler.triggers?.crons) || !wrangler.triggers.crons.includes("* * * * *")) {
            throw new Error("Expected Vite Cloudflare wrangler.json to include the daily-marker schedule cron trigger.")
          }
          if (!Array.isArray(wrangler.kv_namespaces) || wrangler.kv_namespaces.length === 0) {
            throw new Error("Expected Vite Cloudflare wrangler.json to include kv_namespaces.")
          }
          if (typeof wrangler.artifacts !== "undefined") {
            throw new Error("Vite Cloudflare wrangler.json must not include Workspace Artifacts bindings.")
          }
          NODE

      - name: Dry-run Vite Cloudflare deploy
        if: matrix.framework == 'vite' && matrix.provider == 'cloudflare'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler --cwd playground/vite/dist/vite deploy --config wrangler.json --dry-run

      - name: Build Vite E2E (vercel)
        if: matrix.framework == 'vite' && matrix.provider == 'vercel'
        env:
          BLOB_READ_WRITE_TOKEN: ${{ steps.prepare_vercel.outputs.blob_token }}
          KV_REST_API_TOKEN: ${{ steps.prepare_vercel.outputs.kv_token }}
          KV_REST_API_URL: ${{ steps.prepare_vercel.outputs.kv_url }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          VERCEL_PROJECT_ID: ${{ steps.prepare_vercel.outputs.project_id }}
          VERCEL_TEAM_ID: ${{ steps.prepare_vercel.outputs.org_id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VITEHUB_HOSTING: vercel
          VITEHUB_VITE_MODE: e2e
          VITEHUB_WORKSPACE_BLOB_PREFIX: vitehub/workspace-e2e/${{ matrix.framework }}
        run: pnpm --dir playground/vite build

      - name: Assert Vite Vercel artifact purity
        if: matrix.framework == 'vite' && matrix.provider == 'vercel'
        run: |
          node <<'NODE'
          const { existsSync, readFileSync } = require("node:fs")
          const bundle = readFileSync("playground/vite/.vercel/output/functions/__server.func/index.mjs", "utf8")
          if (/createCloudflareArtifactsWorkspaceStore|isomorphic-git/.test(bundle)) {
            throw new Error("Vercel Vite bundle must not include the Cloudflare Artifacts store implementation.")
          }
          if (/cloudflare:workers|@cloudflare\/sandbox/.test(bundle)) {
            throw new Error("Vercel Vite bundle must not include Cloudflare-only sandbox runtime code.")
          }
          if (bundle.includes("@vitejs/devtools") || /import\(["']vite["']\)/.test(bundle)) {
            throw new Error("Vercel Vite bundle must not include Vite or Vite DevTools runtime code.")
          }
          const config = JSON.parse(readFileSync("playground/vite/.vercel/output/config.json", "utf8"))
          const expected = { path: "/api/vitehub/schedules/vercel/daily-marker", schedule: "* * * * *" }
          if (!Array.isArray(config.crons) || !config.crons.some(cron => cron.path === expected.path && cron.schedule === expected.schedule)) {
            throw new Error(`Expected Vite Vercel config.json crons to include ${JSON.stringify(expected)}.`)
          }
          const functionFile = "playground/vite/.vercel/output/functions/api/vitehub/schedules/vercel/daily-marker.func/index.mjs"
          if (!existsSync(functionFile)) {
            throw new Error(`Expected generated Vite Vercel schedule function at ${functionFile}.`)
          }
          if (!readFileSync(functionFile, "utf8").includes("executeStaticSchedule")) {
            throw new Error("Expected Vite Vercel schedule function to execute the static schedule handler.")
          }
          NODE

      - name: Smoke import Vite Vercel function
        if: matrix.framework == 'vite' && matrix.provider == 'vercel'
        env:
          BLOB_READ_WRITE_TOKEN: ${{ steps.prepare_vercel.outputs.blob_token }}
          KV_REST_API_TOKEN: ${{ steps.prepare_vercel.outputs.kv_token }}
          KV_REST_API_URL: ${{ steps.prepare_vercel.outputs.kv_url }}
        run: node -e "import('./playground/vite/.vercel/output/functions/__server.func/index.mjs')"

      - name: Deploy Cloudflare
        id: deploy_cloudflare
        if: matrix.provider == 'cloudflare'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ secrets.CLOUDFLARE_WORKERS_SUBDOMAIN }}
        run: |
          WORKER_NAME="vitehub-playground-${{ matrix.framework }}"
          if [ "${{ matrix.framework }}" = "vite" ]; then
            DEPLOY_DIR="playground/vite/dist/vite"
          else
            DEPLOY_DIR="playground/nitro/.output/server"
          fi

          npx wrangler --cwd "$DEPLOY_DIR" deploy --config wrangler.json --name "$WORKER_NAME"
          echo "url=https://${WORKER_NAME}.${CLOUDFLARE_WORKERS_SUBDOMAIN}.workers.dev" >> "$GITHUB_OUTPUT"
          echo "worker=$WORKER_NAME" >> "$GITHUB_OUTPUT"

      - name: Deploy Vercel
        id: deploy_vercel
        if: matrix.provider == 'vercel'
        env:
          VERCEL_ORG_ID: ${{ steps.prepare_vercel.outputs.org_id }}
          VERCEL_PROJECT_ID: ${{ steps.prepare_vercel.outputs.project_id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          APP_DIR="${{ steps.prepare_vercel.outputs.app_dir }}"
          DEPLOYMENT_URL=$(VERCEL_ORG_ID="$VERCEL_ORG_ID" VERCEL_PROJECT_ID="$VERCEL_PROJECT_ID" npx vercel deploy --cwd "$APP_DIR" --prebuilt --prod --yes --token "$VERCEL_TOKEN" | grep -Eo 'https://[^ ]+\.vercel\.app' | tail -n 1)
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "Failed to capture Vercel deployment URL." >&2
            exit 1
          fi

          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Resolve deployment URL
        id: url
        run: |
          if [ "${{ matrix.provider }}" = "cloudflare" ]; then
            echo "url=${{ steps.deploy_cloudflare.outputs.url }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=${{ steps.deploy_vercel.outputs.url }}" >> "$GITHUB_OUTPUT"
          fi

      - name: KV Live E2E (${{ matrix.provider }} × ${{ matrix.framework }})
        run: pnpm --dir packages/kv test:e2e --mode live --provider ${{ matrix.provider }} --framework ${{ matrix.framework }} --url "${{ steps.url.outputs.url }}"

      - name: Queue Live E2E (${{ matrix.provider }} × ${{ matrix.framework }})
        timeout-minutes: 5
        run: node packages/queue/test/e2e-live.mjs --framework "${{ matrix.framework }}" --provider "${{ matrix.provider }}" --url "${{ steps.url.outputs.url }}"

      - name: Schedule Live E2E (${{ matrix.provider }} × ${{ matrix.framework }})
        timeout-minutes: 7
        run: node packages/schedule/test/e2e-live.mjs --framework "${{ matrix.framework }}" --provider "${{ matrix.provider }}" --url "${{ steps.url.outputs.url }}" --timeout 270000

      - name: Sandbox Live E2E (${{ matrix.provider }} × ${{ matrix.framework }})
        run: pnpm --dir packages/sandbox test:e2e --mode live --provider ${{ matrix.provider }} --framework ${{ matrix.framework }} --url "${{ steps.url.outputs.url }}"

      - name: Workflow Live E2E (${{ matrix.provider }} × ${{ matrix.framework }})
        timeout-minutes: 5
        run: node packages/workflow/test/e2e-live.mjs --framework "${{ matrix.framework }}" --provider "${{ matrix.provider }}" --url "${{ steps.url.outputs.url }}"

      - name: Workspace Live E2E (${{ matrix.provider }} × ${{ matrix.framework }})
        run: pnpm --dir packages/workspace test:e2e --mode live --provider ${{ matrix.provider }} --framework ${{ matrix.framework }} --url "${{ steps.url.outputs.url }}"

      - name: Blob Live E2E (vite × ${{ matrix.provider }})
        if: matrix.framework == 'vite'
        env:
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
        run: pnpm --dir packages/blob test:e2e --mode live --url "${{ steps.url.outputs.url }}"

      - name: DB Live E2E (vite × ${{ matrix.provider }})
        if: matrix.framework == 'vite'
        run: pnpm --dir packages/database test:e2e --url "${{ steps.url.outputs.url }}"
