name: manual live e2e

on:
  workflow_dispatch:

concurrency:
  group: manual-live-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup-cloudflare:
    name: setup
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Build vitehub packages
        run: pnpm -r --filter '@vitehub/blob' --filter '@vitehub/db' --filter '@vitehub/kv' --filter '@vitehub/queue' --filter '@vitehub/sandbox' --filter '@vitehub/workflow' --filter '@vitehub/workspace' build

      - name: Upload package builds
        uses: actions/upload-artifact@v6
        with:
          name: vitehub-package-dist
          path: |
            packages/blob/dist
            packages/db/dist
            packages/kv/dist
            packages/queue/dist
            packages/sandbox/dist
            packages/workflow/dist
            packages/workspace/dist
          retention-days: 1
          if-no-files-found: error

      - name: Ensure Cloudflare Queues
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
        run: |
          QUEUES="queue--77656c636f6d65 queue--77656c636f6d652d656d61696c"
          export QUEUES

          for queue in $QUEUES; do
            if ! npx wrangler queues list | grep -q "$queue"; then
              npx wrangler queues create "$queue"
            fi
          done

          if [ -n "$CLOUDFLARE_R2_BUCKET_NAME" ] && ! npx wrangler r2 bucket list | grep -q "$CLOUDFLARE_R2_BUCKET_NAME"; then
            npx wrangler r2 bucket create "$CLOUDFLARE_R2_BUCKET_NAME"
          fi

  live-e2e:
    name: live e2e
    needs: setup-cloudflare
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        framework: [vite, nitro]
        provider: [cloudflare, vercel]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Download package builds
        uses: actions/download-artifact@v8
        with:
          name: vitehub-package-dist
          path: packages

      - name: Validate Cloudflare env
        if: matrix.provider == 'cloudflare'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ secrets.CLOUDFLARE_WORKERS_SUBDOMAIN }}
        run: |
          missing=()
          for required in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_WORKERS_SUBDOMAIN CLOUDFLARE_KV_NAMESPACE_ID; do
            if [ -z "${!required}" ]; then
              missing+=("$required")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Cloudflare secret verification failed: missing %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Prepare Vercel project
        id: prepare_vercel
        if: matrix.provider == 'vercel'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          APP_DIR="playground/${{ matrix.framework }}"
          PROJECT_NAME="vitehub-playground-${{ matrix.framework }}"

          npx vercel link --yes --cwd "$APP_DIR" --project "$PROJECT_NAME" --token "$VERCEL_TOKEN"

          readarray -t VERCEL_CONFIG < <(node -e 'const { readFileSync } = require("node:fs"); const { join } = require("node:path"); const config = JSON.parse(readFileSync(join(process.argv[1], ".vercel", "project.json"), "utf8")); console.log(config.orgId); console.log(config.projectId);' "$APP_DIR")
          VERCEL_ORG_ID="${VERCEL_CONFIG[0]}"
          VERCEL_PROJECT_ID="${VERCEL_CONFIG[1]}"

          if [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Failed to read linked Vercel project metadata." >&2
            exit 1
          fi

          PULLED_ENV_FILE="$(mktemp)"
          trap 'rm -f "$PULLED_ENV_FILE"' EXIT
          VERCEL_ORG_ID="$VERCEL_ORG_ID" VERCEL_PROJECT_ID="$VERCEL_PROJECT_ID" \
            npx vercel env pull "$PULLED_ENV_FILE" --environment=production --yes --cwd "$APP_DIR" --token "$VERCEL_TOKEN" >/dev/null

          declare -A REQUIRED_ENV_KEYS=(
            [kv_token]=KV_REST_API_TOKEN
            [kv_url]=KV_REST_API_URL
          )
          missing=()

          for output_name in "${!REQUIRED_ENV_KEYS[@]}"; do
            env_name="${REQUIRED_ENV_KEYS[$output_name]}"
            value="$(node .github/scripts/get-env-value.mjs "$PULLED_ENV_FILE" "$env_name")"

            if [ -z "$value" ]; then
              missing+=("$env_name")
              continue
            fi

            echo "::add-mask::$value"
            {
              echo "${output_name}<<EOF"
              echo "$value"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Vercel production env verification failed: missing %s on the linked project.\n' "${missing[*]}" >&2
            exit 1
          fi

          KV_URL="$(node .github/scripts/get-env-value.mjs "$PULLED_ENV_FILE" KV_REST_API_URL)"
          case "$KV_URL" in
            https://*) ;;
            *)
              echo "Vercel production env verification failed: KV_REST_API_URL must start with https://." >&2
              exit 1
              ;;
          esac

          echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"
          echo "org_id=$VERCEL_ORG_ID" >> "$GITHUB_OUTPUT"
          echo "project_id=$VERCEL_PROJECT_ID" >> "$GITHUB_OUTPUT"

      - name: Build Nitro (cloudflare)
        if: matrix.framework == 'nitro' && matrix.provider == 'cloudflare'
        env:
          KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        run: pnpm --dir playground/nitro exec nitro build --preset cloudflare-module

      - name: Assert Nitro Cloudflare KV bindings
        if: matrix.framework == 'nitro' && matrix.provider == 'cloudflare'
        run: |
          node <<'NODE'
          const { readFileSync } = require("node:fs")
          const wrangler = JSON.parse(readFileSync("playground/nitro/.output/server/wrangler.json", "utf8"))
          if (!Array.isArray(wrangler.kv_namespaces) || wrangler.kv_namespaces.length === 0) {
            throw new Error("Expected Nitro Cloudflare wrangler.json to include kv_namespaces.")
          }
          NODE

      - name: Build Nitro (vercel)
        if: matrix.framework == 'nitro' && matrix.provider == 'vercel'
        env:
          VERCEL_ORG_ID: ${{ steps.prepare_vercel.outputs.org_id }}
          VERCEL_PROJECT_ID: ${{ steps.prepare_vercel.outputs.project_id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          APP_DIR="${{ steps.prepare_vercel.outputs.app_dir }}"
          npx vercel env run --cwd "$APP_DIR" --token "$VERCEL_TOKEN" -e production -- pnpm exec nitro build --preset vercel

      - name: Build Vite E2E (cloudflare)
        if: matrix.framework == 'vite' && matrix.provider == 'cloudflare'
        env:
          BLOB_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          VITEHUB_CLOUDFLARE_WORKER_NAME: vitehub-playground-vite
          VITEHUB_HOSTING: cloudflare
          VITEHUB_VITE_MODE: e2e
        run: pnpm --dir playground/vite build

      - name: Assert Vite Cloudflare artifact purity
        if: matrix.framework == 'vite' && matrix.provider == 'cloudflare'
        run: |
          node <<'NODE'
          const { readFileSync } = require("node:fs")
          const bundle = readFileSync("playground/vite/dist/vite/index.js", "utf8")
          if (/from\s+["']@vercel\/functions["']/.test(bundle) || /require\(["']@vercel\/functions["']\)/.test(bundle)) {
            throw new Error("Cloudflare Vite bundle must not include @vercel/functions imports.")
          }
          if (/from\s+["']@cloudflare\/sandbox["']/.test(bundle) || /require\(["']@cloudflare\/sandbox["']\)/.test(bundle)) {
            throw new Error("Cloudflare Vite bundle must not include bare @cloudflare/sandbox imports.")
          }
          const wrangler = JSON.parse(readFileSync("playground/vite/dist/vite/wrangler.json", "utf8"))
          if (!Array.isArray(wrangler.kv_namespaces) || wrangler.kv_namespaces.length === 0) {
            throw new Error("Expected Vite Cloudflare wrangler.json to include kv_namespaces.")
          }
          NODE

      - name: Build Vite E2E (vercel)
        if: matrix.framework == 'vite' && matrix.provider == 'vercel'
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          KV_REST_API_TOKEN: ${{ steps.prepare_vercel.outputs.kv_token }}
          KV_REST_API_URL: ${{ steps.prepare_vercel.outputs.kv_url }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          VERCEL_PROJECT_ID: ${{ steps.prepare_vercel.outputs.project_id }}
          VERCEL_TEAM_ID: ${{ steps.prepare_vercel.outputs.org_id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VITEHUB_HOSTING: vercel
          VITEHUB_VITE_MODE: e2e
        run: pnpm --dir playground/vite build

      - name: Deploy Cloudflare
        id: deploy_cloudflare
        if: matrix.provider == 'cloudflare'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ secrets.CLOUDFLARE_WORKERS_SUBDOMAIN }}
        run: |
          WORKER_NAME="vitehub-playground-${{ matrix.framework }}"
          if [ "${{ matrix.framework }}" = "vite" ]; then
            DEPLOY_DIR="playground/vite/dist/vite"
          else
            DEPLOY_DIR="playground/nitro/.output/server"
          fi

          npx wrangler --cwd "$DEPLOY_DIR" deploy --config wrangler.json --name "$WORKER_NAME"
          echo "url=https://${WORKER_NAME}.${CLOUDFLARE_WORKERS_SUBDOMAIN}.workers.dev" >> "$GITHUB_OUTPUT"
          echo "worker=$WORKER_NAME" >> "$GITHUB_OUTPUT"

      - name: Deploy Vercel
        id: deploy_vercel
        if: matrix.provider == 'vercel'
        env:
          VERCEL_ORG_ID: ${{ steps.prepare_vercel.outputs.org_id }}
          VERCEL_PROJECT_ID: ${{ steps.prepare_vercel.outputs.project_id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          APP_DIR="${{ steps.prepare_vercel.outputs.app_dir }}"
          DEPLOYMENT_URL=$(VERCEL_ORG_ID="$VERCEL_ORG_ID" VERCEL_PROJECT_ID="$VERCEL_PROJECT_ID" npx vercel deploy --cwd "$APP_DIR" --prebuilt --prod --yes --token "$VERCEL_TOKEN" | grep -Eo 'https://[^ ]+\.vercel\.app' | tail -n 1)
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "Failed to capture Vercel deployment URL." >&2
            exit 1
          fi

          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Resolve deployment URL
        id: url
        run: |
          if [ "${{ matrix.provider }}" = "cloudflare" ]; then
            echo "url=${{ steps.deploy_cloudflare.outputs.url }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=${{ steps.deploy_vercel.outputs.url }}" >> "$GITHUB_OUTPUT"
          fi

      - name: KV Live E2E (${{ matrix.provider }} × ${{ matrix.framework }})
        run: pnpm --dir packages/kv test:e2e --mode live --provider ${{ matrix.provider }} --framework ${{ matrix.framework }} --url "${{ steps.url.outputs.url }}"

      - name: Queue Live E2E (${{ matrix.provider }} × ${{ matrix.framework }})
        timeout-minutes: 5
        run: node packages/queue/test/e2e-live.mjs --framework "${{ matrix.framework }}" --provider "${{ matrix.provider }}" --url "${{ steps.url.outputs.url }}"

      - name: Sandbox Live E2E (${{ matrix.provider }} × ${{ matrix.framework }})
        run: pnpm --dir packages/sandbox test:e2e --mode live --provider ${{ matrix.provider }} --framework ${{ matrix.framework }} --url "${{ steps.url.outputs.url }}"

      - name: Workflow Live E2E (${{ matrix.provider }} × ${{ matrix.framework }})
        timeout-minutes: 5
        run: node packages/workflow/test/e2e-live.mjs --framework "${{ matrix.framework }}" --provider "${{ matrix.provider }}" --url "${{ steps.url.outputs.url }}"

      - name: Workspace Live E2E (${{ matrix.provider }} × ${{ matrix.framework }})
        run: pnpm --dir packages/workspace test:e2e --mode live --provider ${{ matrix.provider }} --framework ${{ matrix.framework }} --url "${{ steps.url.outputs.url }}"

      - name: Blob Live E2E (vite × ${{ matrix.provider }})
        if: matrix.framework == 'vite'
        env:
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
        run: pnpm --dir packages/blob test:e2e --mode live --url "${{ steps.url.outputs.url }}"

      - name: DB Live E2E (vite × ${{ matrix.provider }})
        if: matrix.framework == 'vite'
        run: pnpm --dir packages/db test:e2e --url "${{ steps.url.outputs.url }}"
