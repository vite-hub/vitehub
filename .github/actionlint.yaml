paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      # GitHub added concurrency.queue on 2026-05-07. actionlint 1.7.12 does
      # not know the key yet. Remove this entry when actionlint releases
      # https://github.com/rhysd/actionlint/pull/654 (https://github.com/rhysd/actionlint/issues/657).
      - 'unexpected key "queue" for "concurrency" section'
