version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
      - /.github/actions/setup-deno
    schedule:
      interval: weekly
    # Wait one week after a release so a compromised version can be found
    # and pulled before it reaches CI.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    allow:
      - dependency-name: pkg-pr-new
      - dependency-name: wrangler
    groups:
      ci-executables:
        patterns:
          - pkg-pr-new
          - wrangler
