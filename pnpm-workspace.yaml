  - "@cloudflare/workers-types@5.20261123.1"
  - "@nuxt/kit-nightly@5.0.0-2611222336-0ed8910"
  - "@nuxt/nitro-server-nightly@5.0.0-2611222336-0ed8910"
  - "@nuxt/schema-nightly@5.0.0-2611222336-0ed8910"
  - "@nuxt/vite-builder-nightly@5.0.0-2611222336-0ed8910"
  - "@nuxt/vite-server-nightly@5.0.0-2611222336-0ed8910"
  - "@pierre/diffs@1.7.1"
  - "@vercel/nft@1.11.12"
  - evlog@2.37.1
  - forges@0.4.1
  - ioredis@6.1.0
  - knip@6.48.0
  - nuxt-nightly@5.0.0-2611222336-0ed8910
