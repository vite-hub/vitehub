        optional: true
      react-dom:
        optional: true
  "@github-tools/sdk@1.10.0":
    dependencies:
      "@vercel/connect": 0.6.1
  "@nuxt/content@3":
    dependencies:
      h3: ^1.15.11
  "@nuxtjs/mcp-toolkit@0.22.0":
