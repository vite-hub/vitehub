    "@ai-sdk/vue": 4.0.179
    "@modelcontextprotocol/sdk": ^1.32.2
    "@types/json-schema": ^7.0.15
    advocaat: ^0.0.6
    agents: ^0.34.0
    ai: 7.0.179
