packages:
  - "docs"
  - "fixtures/tutorials/chat-app"
  - "packages/*"
  - "packages/*/examples/*"
  - "packages/docs/playground"
  - "playground/console"
  - "playground/content"
  - "playground/docs"
  - "playground/logs"
catalog:
  "@cloudflare/vitest-plugin": ^1.3.6
  "@t3tools/provider-runtime": https://pkg.pr.new/vite-hub/t3code/@t3tools/provider-runtime@2a519db9ccb4227091f0d8a839d7121af9d6aed5
  "@types/proper-lockfile": 4.1.4
  forges: 0.3.1
  proper-lockfile: 4.1.2
  comark-chat: 0.10.1
  vite-doctor: https://pkg.pr.new/vite-doctor@9f33eb1748fb93f7399579b60d3bff6af3895eb1
  # `@cloudflare/vitest-plugin` depends on this exact Wrangler, so CI and the docs use the same one.
  wrangler: 4.157.0

catalogMode: prefer
linkWorkspacePackages: true
# `@t3tools/provider-runtime` declares `@t3tools/contracts` by tarball URL.
blockExoticSubdeps: false

# pnpm 10 skipped these build scripts, and nothing depends on them running.
allowBuilds:
  "@mongodb-js/zstd": false
  "@nestjs/core": false
  "@parcel/watcher": false
  "@swc/core": false
  better-sqlite3: false
  cbor-extract: false
  core-js-pure: false
  cpu-features: false
  esbuild: false
  msgpackr-extract: false
  node-liblzma: false
  ssh2: false
  vue-demi: false
  workerd: false

