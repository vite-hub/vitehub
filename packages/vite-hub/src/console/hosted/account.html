<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <meta name="theme-color" data-vitehub-console-theme="light" content="#fdfdfd" media="(prefers-color-scheme: light)">
    <meta name="theme-color" data-vitehub-console-theme="dark" content="#0a0a0a" media="(prefers-color-scheme: dark)">
    <meta name="robots" content="noindex, nofollow">
    <!-- People sign in to the Console, and its server opens the projects of their team. -->
    <meta name="vitehub-console-mode" content="account">
    <!--vitehub-console-metadata-->
    <title>ViteHub Console</title>
  </head>
  <body>
    <!--
      The first paint, before the app mounts. The Console server sets data-vitehub-boot to the view that the visit opens
      (`@vite-hub/console`, server/routes), so the page keeps its shape when the app takes over:
      sign-in and invite: the sign-in page; shell: the pages of the team; app: an open app. Both draw the sidebar rail.
    -->
    <div id="app"><div class="vitehub-account-boot" data-vitehub-boot="app" data-vitehub-page="">
      <div class="vitehub-console-boot vitehub-account-boot__app"><div class="vitehub-sidebar"><div class="vitehub-sidebar__surface"><div class="vitehub-sidebar__top"><span class="vitehub-sidebar__item"><span class="vitehub-sidebar__icon"><svg class="vitehub-console-boot__mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 18" aria-hidden="true"><path fill="currentColor" d="M19.734 8.156 15.576.844A1.66 1.66 0 0 0 14.135 0H5.819C5.226 0 4.677.32 4.38.844L.222 8.156a1.71 1.71 0 0 0 0 1.688l4.158 7.312c.297.523.846.844 1.439.844h8.316c.593 0 1.142-.32 1.438-.844l4.158-7.312c.3-.523.3-1.165.003-1.688Z"/></svg></span></span></div></div></div><div class="vitehub-console-boot__panel"><div class="vitehub-console-boot__header"></div><p role="status" class="vitehub-console-opening">Opening Console…</p><noscript class="vitehub-console-opening">Enable JavaScript to use the Console.</noscript></div></div>

      <div class="vitehub-console-boot vitehub-account-boot__shell">
        <div class="vitehub-sidebar"><div class="vitehub-sidebar__surface"><div class="vitehub-sidebar__top"><span class="vitehub-sidebar__item"><span class="vitehub-sidebar__icon"><svg class="vitehub-console-boot__mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 18" aria-hidden="true"><path fill="currentColor" d="M19.734 8.156 15.576.844A1.66 1.66 0 0 0 14.135 0H5.819C5.226 0 4.677.32 4.38.844L.222 8.156a1.71 1.71 0 0 0 0 1.688l4.158 7.312c.297.523.846.844 1.439.844h8.316c.593 0 1.142-.32 1.438-.844l4.158-7.312c.3-.523.3-1.165.003-1.688Z"/></svg></span></span></div></div></div>
        <div class="vitehub-account-boot__panel">
          <div class="vitehub-console-boot__header"></div>
          <p role="status" class="vitehub-account-boot__status">Opening Console…</p>
          <noscript class="vitehub-account-boot__status">Enable JavaScript to use the Console.</noscript>
        </div>
      </div>

      <main class="vitehub-project-gate vitehub-account-boot__sign-in">
        <div class="vitehub-project-gate__body">
          <svg class="vitehub-account-boot__gate-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 18" aria-hidden="true"><path fill="currentColor" d="M19.734 8.156 15.576.844A1.66 1.66 0 0 0 14.135 0H5.819C5.226 0 4.677.32 4.38.844L.222 8.156a1.71 1.71 0 0 0 0 1.688l4.158 7.312c.297.523.846.844 1.439.844h8.316c.593 0 1.142-.32 1.438-.844l4.158-7.312c.3-.523.3-1.165.003-1.688Z"/></svg>
          <div class="vitehub-account-boot__intro">
            <h1 class="vitehub-account-boot__title">Sign in to ViteHub Console</h1>
            <p class="vitehub-project-gate__text">Open your team's ViteHub apps from any browser.</p>
          </div>
          <p role="status" class="vitehub-account-boot__status">Opening Console…</p>
          <noscript class="vitehub-project-gate__text">Enable JavaScript to use the Console.</noscript>
        </div>
      </main>
    </div></div>
    <script type="module" src="../runtime/client/main.js"></script>
  </body>
</html>
