<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ViteHub Chat DevTools</title>
  </head>
  <body>
    <main class="shell">
      <header class="toolbar">
        <div class="title">ViteHub Chat</div>
        <div class="actions">
          <select id="chat-select" class="select" aria-label="Chat" hidden></select>
          <button id="clear-button" class="button" type="button" disabled title="Clear chat">Clear</button>
        </div>
      </header>
      <section id="transcript" class="transcript" aria-live="polite">
        <div id="empty-state" class="empty">Connecting to Vite DevTools...</div>
      </section>
      <form id="composer" class="composer">
        <textarea id="message-input" class="input" rows="1" placeholder="Type a message..." aria-label="Message" disabled></textarea>
        <button id="send-button" class="send" type="submit" disabled title="Send message">Send</button>
      </form>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
