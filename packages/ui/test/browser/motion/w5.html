<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wave 5 motion page</title>
    <style>
      body { margin: 0; padding: 40px; font: 14px/1.4 system-ui, sans-serif; color: #171717; background: #fff; }
      section { display: flex; gap: 24px; align-items: flex-start; margin-bottom: 40px; min-height: 60px; position: relative; }
      button { font: inherit; padding: 6px 12px; border: 1px solid #d4d4d4; border-radius: 8px; background: #fff; }
      [data-test=chevron] { display: inline-block; width: 16px; height: 16px; }
      [aria-expanded=true] :is([data-test=chevron], [data-test=off-chevron]), details[open] [data-test=details-chevron] { rotate: 90deg; }
      [data-test=details-chevron] { display: inline-block; width: 16px; height: 16px; }
      .marks { position: relative; width: 300px; height: 60px; }
      .mark { position: absolute; left: 20px; top: 16px; width: 28px; height: 28px; border-radius: 14px 14px 14px 4px; background: #171717; }
      .spot { position: relative; width: 0; height: 0; }
      .pin { position: absolute; left: 0; top: -28px; width: 28px; height: 28px; border-radius: 14px; background: #171717; }
      .bubble { position: absolute; left: 36px; top: -28px; width: 240px; padding: 10px; border-radius: 6px 18px 18px; background: #f5f5f5; box-shadow: 0 0 0 1px #e5e5e5; }
      .glass { display: flex; align-items: center; justify-content: center; width: 40px; height: 36px; border-radius: 8px; background: #171717; }
      .glass button { border: 0; background: none; padding: 0; width: 40px; height: 36px; }
      .box { width: 240px; height: 40px; border: 1px solid #d4d4d4; border-radius: 12px; }
    </style>
  </head>
  <body>
    <section>
      <button type="button" aria-expanded="false" data-test="disclosure">Steps <svg data-test="chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
      <details data-test="details"><summary>Tools <svg data-test="details-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" fill="none" stroke="currentColor" stroke-width="2"/></svg></summary><p>Open at once.</p></details>
      <div data-motion="none"><button type="button" aria-expanded="false" data-test="off-disclosure">Off <svg data-test="off-chevron" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="m9 18 6-6-6-6" fill="none" stroke="currentColor" stroke-width="2"/></svg></button></div>
    </section>
    <section>
      <div class="marks" data-test="marks"><div class="mark" data-test="mark"></div></div>
    </section>
    <section>
      <div class="spot" data-test="spot" style="left: 40px; top: 30px"><div class="pin" data-test="pin"></div></div>
    </section>
    <section>
      <div class="glass" role="toolbar" aria-label="Folded" data-test="glass"><button type="button" aria-label="Open" data-motion-press-target="[role=toolbar]" data-test="press-target"><svg viewBox="0 0 24 24" width="16" height="16"><circle cx="12" cy="12" r="6" fill="#fff"/></svg></button></div>
      <div class="box" data-test="box"></div>
    </section>
    <script type="module" src="./w5.ts"></script>
  </body>
</html>
