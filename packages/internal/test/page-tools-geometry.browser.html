<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Page tools safe-area geometry regression</title>
<!-- Serve packages/internal with Vite, then open /test/page-tools-geometry.browser.html?vitehub
     at desktop and mobile viewport sizes. This needs native browser layout, not happy-dom. -->
<pre id="result">Running…</pre>
<script type="module">
  import { loadViteHubPageTools } from "../src/runtime/page-tools-loader.ts"
  import { createViteHubPageWindow } from "../src/runtime/page-tools-window.ts"

  function assert(condition, message) {
    if (!condition) throw new Error(message)
  }

  const result = document.querySelector("#result")
  const originalFetch = window.fetch
  const dockKey = "vitehub-tools-dock"
  const collapsedKey = "vitehub-tools-collapsed"
  const offKey = "vitehub-tools-off"
  const saved = [dockKey, collapsedKey, offKey].map(key => localStorage.getItem(key))
  const insets = [
    { top: 60, right: 20, bottom: 30, left: 100 },
    { top: 0, right: 0, bottom: 0, left: 0 },
    { top: 0, right: 7, bottom: 10, left: 3 },
  ]
  const scenarios = insets.flatMap(safe => [false, true].flatMap(collapsed =>
    ["top", "right", "bottom", "left"].flatMap(edge => [0, 50, 100].map(at => ({ safe, collapsed, edge, at }))),
  ))
  let exit
  let toolWindow
  let cases = 0
  const stop = () => {
    exit?.()
    document.querySelector("vitehub-tools-off")?.remove()
    localStorage.removeItem(offKey)
  }
  try {
    localStorage.removeItem(offKey)
    // Only the session request is mocked: the actual loader, pill, window and styles render together.
    window.fetch = async () => Response.json({ tools: [{ id: "content", label: "Content", script: "/content.js" }] })
    // A tab can be wider or taller than its toolbar. Its controls must stay reachable at both ends of every edge,
    // including when its content needs to scroll in a small viewport or beside an asymmetric safe area.
    for (const safe of insets) for (const edge of ["top", "right", "bottom", "left"]) for (const at of [0, 50, 100]) {
      localStorage.removeItem(collapsedKey)
      localStorage.setItem(dockKey, JSON.stringify({ edge, at }))
      document.cookie = "vitehub-tools=1; Path=/"
      let tab
      await loadViteHubPageTools({ load: async () => ({ default(context) {
        exit = context.exit
        context.bar.append(Object.assign(document.createElement("button"), { textContent: "Content" }))
        tab = context.createTab()
        tab.attachShadow({ mode: "open" }).innerHTML = `<style>
          .controls{display:flex;justify-content:space-between;width:360px;height:180px}
          button{flex:none;width:100px;height:28px;white-space:nowrap}
          button:last-child{align-self:flex-end}
        </style><section class="controls"><button>Draft</button><button>2 changes</button><button>Back to live</button></section>`
      } }) })
      const pill = document.querySelector("vitehub-pill")
      pill.style.transition = "none"
      for (const [side, value] of Object.entries(safe)) pill.style.setProperty(`--safe-${side}`, `${value}px`)
      for (const animation of tab.getAnimations()) animation.finish()
      const tabs = pill.shadowRoot.querySelector(".tabs")
      const controls = tab.shadowRoot.querySelector(".controls")
      for (const oversized of [false, true]) {
        if (oversized) Object.assign(controls.style, { width: "1800px", height: "1200px" })
        await new Promise(requestAnimationFrame)
        const label = `${edge} ${at}% oversized=${oversized} safe=${JSON.stringify(safe)}`
        const box = tabs.getBoundingClientRect()
        assert(box.left >= Math.max(16, safe.left) - 1 && box.right <= innerWidth - Math.max(16, safe.right) + 1, `${label}: tab horizontal safe bounds (${box.left}, ${box.right})`)
        assert(box.top >= Math.max(16, safe.top) - 1 && box.bottom <= innerHeight - Math.max(16, safe.bottom) + 1, `${label}: tab vertical safe bounds (${box.top}, ${box.bottom})`)
        for (const button of tab.shadowRoot.querySelectorAll("button")) {
          button.scrollIntoView({ block: "nearest", inline: "nearest" })
          const control = button.getBoundingClientRect()
          assert(control.left >= box.left - 1 && control.right <= box.right + 1 && control.top >= box.top - 1 && control.bottom <= box.bottom + 1, `${label}: ${button.textContent} is reachable`)
        }
      }
      const mark = pill.shadowRoot.querySelector("button.mark")
      for (const collapsed of [true, false]) {
        mark.click()
        for (const animation of pill.getAnimations({ subtree: true })) animation.finish()
        assert((getComputedStyle(tabs).visibility === "hidden") === collapsed, `${edge} ${at}%: the tab and its scrollbars hide with the pill`)
      }
      cases++
      stop()
    }
    for (const { safe, collapsed, edge, at } of scenarios) {
      result.textContent = `Running… ${cases}/${scenarios.length}: ${edge} ${at}%, collapsed=${collapsed}`
      if (collapsed) localStorage.setItem(collapsedKey, "1")
      else localStorage.removeItem(collapsedKey)
      document.cookie = "vitehub-tools=1; Path=/"
      localStorage.setItem(dockKey, JSON.stringify({ edge, at }))
      await loadViteHubPageTools({ load: async () => ({ default(context) {
        exit = context.exit
        const trigger = document.createElement("button")
        trigger.textContent = "Content"
        context.bar.append(trigger)
        toolWindow = createViteHubPageWindow({ id: "geometry", title: "Content", trigger, signal: context.signal })
      } }) })
      const pill = document.querySelector("vitehub-pill")
      const host = document.querySelector("vitehub-window")
      for (const element of [pill, host]) {
        for (const [side, value] of Object.entries(safe)) element.style.setProperty(`--safe-${side}`, `${value}px`)
      }
      toolWindow.show()
      // Cancel opening motion so the test measures the final layout, not an intermediate animation frame.
      pill.style.transition = "none"
      const panel = host.shadowRoot.querySelector(".window")
      panel.style.transition = "none"
      await new Promise(requestAnimationFrame)
      await new Promise(requestAnimationFrame)
      const vertical = edge === "left" || edge === "right"
      const hostBox = pill.getBoundingClientRect()
      // Collapsing clips the toolbar without reflowing its host. Measure the visible hexagon's box.
      const height = Number.parseFloat(getComputedStyle(pill).getPropertyValue("--vitehub-hex-h"))
      const width = height * 10 / 9
      const pillBox = collapsed
        ? new DOMRect(hostBox.left + (hostBox.width - width) / 2, hostBox.top + (hostBox.height - height) / 2, width, height)
        : hostBox
      const bounds = (label) => {
        const box = panel.getBoundingClientRect()
        assert(box.left >= safe.left - 1 && box.right <= innerWidth - safe.right + 1, `${edge} ${at}% ${label}: horizontal safe bounds`)
        assert(box.top >= safe.top - 1 && box.bottom <= innerHeight - safe.bottom + 1, `${edge} ${at}% ${label}: vertical safe bounds`)
        const gap = edge === "top" ? box.top - pillBox.bottom : edge === "bottom" ? pillBox.top - box.bottom : edge === "left" ? box.left - pillBox.right : pillBox.left - box.right
        assert(Math.abs(gap - 8) < 1, `${edge} ${at}% ${label}: gap ${gap}`)
        return box
      }
      const measure = (label) => {
        const box = panel.getBoundingClientRect()
        const pillPoint = vertical ? pillBox.top + pillBox.height * at / 100 : pillBox.left + pillBox.width * at / 100
        const windowPoint = vertical ? box.top + box.height * at / 100 : box.left + box.width * at / 100
        assert(Math.abs(pillPoint - windowPoint) < 1, `${edge} ${at}% collapsed=${collapsed} safe=${JSON.stringify(safe)} ${label}: pill ${pillPoint}, window ${windowPoint}`)
        bounds(label)
      }
      measure("default size")
      panel.style.width = "2000px"
      panel.style.height = "2000px"
      measure("resized beyond viewport")
      host.shadowRoot.querySelector(".expand").click()
      bounds("expanded")
      cases++
      toolWindow.destroy()
      stop()
    }
    // The mark only translates to the hexagon, so the bar keeps its size and the resize glide never cancels the morph.
    for (const edge of ["top", "right", "bottom", "left"]) {
      localStorage.removeItem(collapsedKey)
      localStorage.setItem(dockKey, JSON.stringify({ edge, at: 50 }))
      document.cookie = "vitehub-tools=1; Path=/"
      await loadViteHubPageTools({ load: async () => ({ default(context) {
        exit = context.exit
        context.bar.append(Object.assign(document.createElement("button"), { textContent: "Content" }))
      } }) })
      const pill = document.querySelector("vitehub-pill")
      const toolbar = pill.shadowRoot.querySelector("div")
      const mark = pill.shadowRoot.querySelector("button.mark")
      const size = [toolbar.offsetWidth, toolbar.offsetHeight].join("x")
      for (const collapsed of [true, false]) {
        mark.click()
        await new Promise(requestAnimationFrame)
        await new Promise(requestAnimationFrame)
        assert([toolbar.offsetWidth, toolbar.offsetHeight].join("x") === size, `${edge} collapsed=${collapsed}: the bar keeps its size`)
        const morph = toolbar.getAnimations().find(animation => animation.transitionProperty === "clip-path")
        assert(morph?.playState === "running", `${edge} collapsed=${collapsed}: the clip morph runs`)
        await morph.finished
        if (collapsed) {
          const box = toolbar.getBoundingClientRect()
          const center = mark.getBoundingClientRect()
          assert(Math.abs(center.x + center.width / 2 - box.x - box.width / 2) < 1 && Math.abs(center.y + center.height / 2 - box.y - box.height / 2) < 1, `${edge}: the mark is on the hexagon`)
        }
      }
      cases++
      stop()
    }
    result.textContent = `PASS: ${cases} dock states keep tabs reachable and windows aligned at default and oversized sizes, with zero, low and asymmetric safe areas; expanded windows stay within safe bounds; the hexagon morph keeps the bar size on every edge`
  } catch (error) {
    result.textContent = `FAIL: ${error.stack}`
    throw error
  } finally {
    toolWindow?.destroy()
    stop()
    window.fetch = originalFetch
    for (const [index, key] of [dockKey, collapsedKey, offKey].entries()) {
      if (saved[index] === null) localStorage.removeItem(key)
      else localStorage.setItem(key, saved[index])
    }
  }
</script>
